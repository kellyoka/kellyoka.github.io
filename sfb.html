                        str += '<div style="float:right;"><input type="number" id="eaPhotonRound' + z + '" min="0" max="' + PHOTON_ROUND_MAX + '" value="0" style="width:35px;text-align:center;" oninput="updateEnergyAllocTotal();"></div>';
                        str += '<div style="clear:both;"></div>';
                    } else if (wEntry.loadRounds == 1) {
                        var maxRound2 = Math.min(PHOTON_ROUND_MAX, PHOTON_TOTAL_MAX - wEntry.investedPower);
                        str += '<div style="float:left;">' + wName + ' [' + displayNumber + '] - load r2 (warp only, [' + wEntry.investedPower + '], ' + PHOTON_ROUND_MIN + '-' + maxRound2 + 'pts more):</div>';
                        str += '<div style="float:right;"><input type="number" id="eaPhotonRound' + z + '" min="0" max="' + maxRound2 + '" value="0" style="width:35px;text-align:center;" oninput="updateEnergyAllocTotal();"></div>';
                        str += '<div style="clear:both;"></div>';
                    } else if (wEntry.armedTurnNumber == turnNumber) {
                        str += '<div>' + wName + ' [' + displayNumber + '] - armed (' + wEntry.loadType + ', ' + wEntry.investedPower + 'pt) - ready to fire this turn</div>';
                    } else {
                        var maintCost = getPhotonMaintenanceCost(wEntry);
                        var topUpMax = PHOTON_TOTAL_MAX - wEntry.investedPower;
                        str += '<div><label title="Uncheck to let it discharge"><input type="checkbox" id="eaMaintain' + z + '" checked onclick="updateEnergyAllocTotal();"> ' + wName + ' [' + displayNumber + '] (' + wEntry.loadType + ', ' + wEntry.investedPower + 'pt) - hold ' + maintCost + 'pt</label></div>';
                        if (topUpMax > 0) {
                            str += '<div style="float:left;padding-left:20px;">Add power to overload it (warp only, 0-' + topUpMax + 'pt more):</div>';
                            str += '<div style="float:right;"><input type="number" id="eaPhotonTopUp' + z + '" min="0" max="' + topUpMax + '" value="0" style="width:35px;text-align:center;" oninput="updateEnergyAllocTotal();"></div>';
                            str += '<div style="clear:both;"></div>';
                        }
                    }
                } else if (wEntry.bArmed) {
                    var armedNote = isDisruptorWeaponTypeId(wEntry.weaponTypeId) ? 'fire this turn or the charge is lost' : 'stays armed until fired';
                    str += '<div>' + wName + ' [' + displayNumber + '] - armed (' + wEntry.loadType + ', ' + armedNote + ')</div>';
                } else if (isDisruptorWeaponTypeId(wEntry.weaponTypeId)) {
                    str += '<div style="float:left;">' + wName + ' [' + displayNumber + ']:</div>';
                    str += '<div style="float:right;"><select id="eaArmType' + z + '" onchange="updateEnergyAllocTotal();">';
                    str += '<option value="none">Don\'t arm</option>';
                    str += '<option value="normal">Normal (' + HEAVY_WEAPON_ARM_COST + 'pt)</option>';
                    str += '<option value="overload">Overload (' + (HEAVY_WEAPON_ARM_COST * 2) + 'pt)</option>';
                    str += '</select></div>';
                    str += '<div style="clear:both;"></div>';
                } else {
                    str += '<div><label><input type="checkbox" id="eaArm' + z + '" onclick="updateEnergyAllocTotal();"> Arm ' + wName + ' [' + displayNumber + ']</label></div>';
                }
            }

            var hasDroneRacks = ship.shipWeapons.some(function (w) { return w.weaponClassId == 4; });
            if (hasDroneRacks) {
                str += '<div class="dividerLine"></div>';
                str += '<div>Drone Racks (disable a rack this turn to reload up to ' + DRONE_RELOAD_AMOUNT + ' spaces from stockpile):</div>';
                str += '<div>Stockpile: ' + formatDroneLoadout(ship.droneStockpile, ship.droneStockpileSpaceMax) + '</div>';
                for (var z = 0; z < ship.shipWeapons.length; z++) {
                    var dEntry = ship.shipWeapons[z];
                    var dClass = 0, dName = '', dDisplayNumber = z + 1;
                    for (var y = 0; y < weaponList.length; y++) {
                        if (weaponList[y].weaponTypeId == dEntry.weaponTypeId) { dClass = weaponList[y].weaponClassId; dName = weaponList[y].weaponName; }
                    }
                    if (dClass != 4) continue;
                    var usedSpace = droneLoadoutSpaceUsed(dEntry.droneLoadout);
                    var stockpileCount = droneLoadoutCount(ship.droneStockpile);
                    if (dEntry.bDestroyed) {
                        str += '<div style="color:#999;">' + dName + ' [' + dDisplayNumber + '] - destroyed</div>';
                    } else if (usedSpace >= dEntry.droneRackSpaceCapacity) {
                        str += '<div>' + dName + ' [' + dDisplayNumber + '] - full (' + formatDroneLoadout(dEntry.droneLoadout, dEntry.droneRackSpaceCapacity) + ')</div>';
                    } else if (stockpileCount <= 0) {
                        str += '<div>' + dName + ' [' + dDisplayNumber + '] - ' + formatDroneLoadout(dEntry.droneLoadout, dEntry.droneRackSpaceCapacity) + ', stockpile empty</div>';
                    } else if (droneLoadoutCount(dEntry.droneLoadout) <= 0) {
                        // completely empty - no "original mix" left in the rack to restore toward,
                        // so the player picks which type from the stockpile to load in
                        str += '<div><label><input type="checkbox" id="eaDroneReload' + z + '" onclick="updateEnergyAllocTotal();"> Reload ' + dName + ' [' + dDisplayNumber + '] (empty) with: ';
                        str += '</label><select id="eaDroneReloadType' + z + '">';
                        for (var t in ship.droneStockpile) {
                            if (ship.droneStockpile[t] > 0) {
                                str += '<option value="' + t + '">' + t + ' (' + ship.droneStockpile[t] + ' in stock)</option>';
                            }
                        }
                        str += '</select> - disables it this turn, up to ' + DRONE_RELOAD_AMOUNT + ' sp</div>';
                    } else {
                        str += '<div><label><input type="checkbox" id="eaDroneReload' + z + '" onclick="updateEnergyAllocTotal();"> Reload ' + dName + ' [' + dDisplayNumber + '] (' + formatDroneLoadout(dEntry.droneLoadout, dEntry.droneRackSpaceCapacity) + ') toward original loadout - disables it this turn, up to ' + DRONE_RELOAD_AMOUNT + ' sp</label></div>';
                    }
                }
            }

            str += '<div class="dividerLine"></div>';
            str += '<div style="float:left;">Speed (max ' + maxSpeed + ', warp + up to 1 impulse only):</div>';
            str += '<div style="float:right;"><input type="number" id="eaSpeed" min="0" max="' + maxSpeed + '" value="' + Math.min(ship.speed, maxSpeed) + '" style="width:35px;text-align:center;" oninput="updateEnergyAllocTotal();"></div>';
            str += '<div style="clear:both;"></div>';
            str += '<div style="font-size:11px;color:#666;padding-bottom:6px;">Turn mode: ' + turnBracketsDisplay(turnMode[ship.turnMode]) + '</div>';
            str += '<div style="float:left;">Recharge batteries (max ' + batteryHeadroom + '):</div>';
            str += '<div style="float:right;"><input type="number" id="eaBattRecharge" min="0" max="' + batteryHeadroom + '" value="0" style="width:35px;text-align:center;" oninput="updateEnergyAllocTotal();"></div>';
            str += '<div style="clear:both;"></div>';

            str += '<div class="dividerLine" style="margin-bottom:8px;"></div>';
            str += '<div style="font-weight:600;">Available: <span id="eaAvailable"></span> &middot; Used: <span id="eaUsed"></span> &middot; Remaining: <span id="eaRemaining"></span></div>';
            str += '<div class="button" style="margin:8px 0px 0px 0px;float:none;padding:5px 10px;" onclick="confirmEnergyAllocation(' + sId + ',' + maxSpeed + ');">Confirm</div>';

            $('#energyAllocPopUpDiv').data('sId', sId).html(str).css('display', 'block');
            updateEnergyAllocTotal();
        }

        // reads every heavy-weapon checkbox currently in the popup and
        // returns how many are newly being armed this turn (already-armed
        // weapons don't have a checkbox at all, so they cost nothing here)
        function computeNewArming(sId) {
            var arrId = findShipArrId(sId);
            var ship = shipList[arrId];
            var result = { totalCost: 0, entries: [] }; // entries: [{index, loadType}]
            for (var z = 0; z < ship.shipWeapons.length; z++) {
                var $select = $('#eaArmType' + z);
                if ($select.length) {
                    var val = $select.val();
                    if (val == 'normal') {
                        result.totalCost += HEAVY_WEAPON_ARM_COST;
                        result.entries.push({ index: z, loadType: 'normal' });
                    } else if (val == 'overload') {
                        result.totalCost += HEAVY_WEAPON_ARM_COST * 2;
                        result.entries.push({ index: z, loadType: 'overload' });
                    }
                } else {
                    var $cb = $('#eaArm' + z);
                    if ($cb.length && $cb.is(':checked')) {
                        result.totalCost += HEAVY_WEAPON_ARM_COST;
                        result.entries.push({ index: z, loadType: 'normal' });
                    }
                }
            }
            return result;
        }

        // gathers photon round-loading inputs and maintenance checkboxes.
        // totalCost is added to the overall "used" power tally; warpCost is
        // separately validated against warp headroom specifically, since
        // photon loading (unlike disruptor arming) must come from warp.
        function computePhotonLoadingInputs(sId) {
            var arrId = findShipArrId(sId);
            var ship = shipList[arrId];
            var result = { totalCost: 0, warpCost: 0, entries: [] }; // entries: [{index, kind:'round'|'maintain'|'discharge', amount}]
            for (var z = 0; z < ship.shipWeapons.length; z++) {
                var wEntry = ship.shipWeapons[z];
                if (wEntry.bDestroyed || !isPhotonWeaponTypeId(wEntry.weaponTypeId)) continue;
                if (wEntry.loadRounds < 2) {
                    var $inp = $('#eaPhotonRound' + z);
                    if ($inp.length) {
                        var v = parseInt($inp.val()) || 0;
                        if (v > 0) {
                            result.totalCost += v;
                            result.warpCost += v;
                            result.entries.push({ index: z, kind: 'round', amount: v });
                        }
                    }
                } else if (wEntry.armedTurnNumber != turnNumber) {
                    var $cb = $('#eaMaintain' + z);
                    if ($cb.length && $cb.is(':checked')) {
                        var maintCost = getPhotonMaintenanceCost(wEntry);
                        var $topUp = $('#eaPhotonTopUp' + z);
                        var topup = ($topUp.length) ? (parseInt($topUp.val()) || 0) : 0;
                        result.totalCost += maintCost + topup;
                        result.warpCost += topup; // top-up power is arming energy - warp only, same as initial loading
                        result.entries.push({ index: z, kind: 'maintain', topup: topup });
                    } else {
                        result.entries.push({ index: z, kind: 'discharge' });
                    }
                }
            }
            return result;
        }

        // gathers which drone racks are checked to reload this turn. Doesn't
        // resolve amounts against the shared stockpile here (that happens
        // in confirmEnergyAllocation, sequentially in array order, so if
        // the stockpile can't cover every checked rack the earlier ones in
        // the list get priority rather than any silently failing outright)
        function computeDroneReloadInputs(sId) {
            var arrId = findShipArrId(sId);
            var ship = shipList[arrId];
            var result = { entries: [] }; // entries: [{index, chosenType?}] - chosenType only set for a rack that was completely empty
            for (var z = 0; z < ship.shipWeapons.length; z++) {
                var wEntry = ship.shipWeapons[z];
                if (wEntry.bDestroyed || wEntry.weaponClassId != 4) continue;
                var $cb = $('#eaDroneReload' + z);
                if ($cb.length && $cb.is(':checked')) {
                    var entry = { index: z };
                    var $typeSel = $('#eaDroneReloadType' + z);
                    if ($typeSel.length) { entry.chosenType = $typeSel.val(); }
                    result.entries.push(entry);
                }
            }
            return result;
        }

        function updateEnergyAllocTotal() {
            var $popup = $('#energyAllocPopUpDiv');
            var sId = $popup.data('sId');

            var arrId = findShipArrId(sId);
            var iArrId = findInternalsArrId(sId);
            var warpAvail = shipInternals[iArrId].rWarp + shipInternals[iArrId].lWarp + shipInternals[iArrId].cWarp;
            var impAvail = shipInternals[iArrId].imp;
            var aprAvail = shipInternals[iArrId].apr;
            var generated = warpAvail + impAvail + aprAvail;

            var discharge = parseInt($('#eaBattDischarge').val()) || 0;
            var recharge = parseInt($('#eaBattRecharge').val()) || 0;
            var phaserAdd = parseInt($('#eaPhaserAdd').val()) || 0;
            var speed = parseInt($('#eaSpeed').val()) || 0;
            var shieldsActive = $('#eaShieldsActive').is(':checked');
            var newArming = computeNewArming(sId);
            var photonLoading = computePhotonLoadingInputs(sId);
            var generalReinforcePower = parseInt($('#eaGeneralReinforce').val()) || 0;
            $('#eaGeneralReinforcePts').text('(+' + Math.floor(generalReinforcePower / GENERAL_REINFORCEMENT_COST) + ' pts)');
            var specificReinforceCost = 0;
            for (var s = 1; s <= 6; s++) {
                var $inp = $('#eaSpecificReinforce' + s);
                if ($inp.length) specificReinforceCost += (parseInt($inp.val()) || 0) * SPECIFIC_REINFORCEMENT_COST;
            }

            // damage control isn't a power cost - tracked and validated
            // against its own separate budget (sum of intact damageCon
            // box values), not folded into the power used/remaining below
            var damageConTotal = getDamageConMax(shipInternals[iArrId]);
            var damageConUsed = 0;
            for (var dcS = 1; dcS <= 6; dcS++) {
                var $dcInp = $('#eaDamageControl' + dcS);
                if ($dcInp.length) damageConUsed += (parseInt($dcInp.val()) || 0);
            }
            var damageConRemaining = damageConTotal - damageConUsed;
            $('#eaDamageConRemaining').text(damageConRemaining).css('color', damageConRemaining < 0 ? '#900' : '#000');

            $('#displayShieldCost').html((shieldsActive ? SHIELD_ACTIVATION_COST : 0));

            var available = generated + discharge;
            var used = LIFE_SUPPORT_COST + FIRE_CONTROL_COST + phaserAdd + recharge + speed
                + newArming.totalCost
                + photonLoading.totalCost
                + generalReinforcePower
                + specificReinforceCost
                + (shieldsActive ? SHIELD_ACTIVATION_COST : 0);
            var remaining = available - used;

            $('#eaAvailable').text(available);
            $('#eaUsed').text(used);
            $('#eaRemaining').text(remaining).css('color', remaining < 0 ? '#900' : (remaining == 0 ? '#090' : '#000'));
        }

        function confirmEnergyAllocation(sId, maxSpeed) {
            var arrId = findShipArrId(sId);
            var ship = shipList[arrId];

            var iArrId = findInternalsArrId(sId);
            var internals = shipInternals[iArrId];

            var warpAvail = internals.rWarp + internals.lWarp + internals.cWarp;
            var impAvail = internals.imp;
            var aprAvail = internals.apr;
            var generated = warpAvail + impAvail + aprAvail;

            var discharge = parseInt($('#eaBattDischarge').val()) || 0;
            var recharge = parseInt($('#eaBattRecharge').val()) || 0;
            var phaserAdd = parseInt($('#eaPhaserAdd').val()) || 0;
            var speed = parseInt($('#eaSpeed').val()) || 0;
            var shieldsActive = $('#eaShieldsActive').is(':checked');
            var generalReinforcePower = parseInt($('#eaGeneralReinforce').val()) || 0;
            var specificReinforce = [0, 0, 0, 0, 0, 0, 0]; // 1-indexed, [0] unused
            for (var s = 1; s <= 6; s++) {
                var $inp = $('#eaSpecificReinforce' + s);
                if ($inp.length) {
                    var v = parseInt($inp.val()) || 0;
                    if (v > 0 && internals['shield' + s] <= 0) {
                        alert('Cannot specifically reinforce shield #' + s + ' - it is currently at 0');
                        return;
                    }
                    specificReinforce[s] = v;
                }
            }
            var specificReinforceCost = specificReinforce.reduce(function (a, b) { return a + b; }, 0) * SPECIFIC_REINFORCEMENT_COST;

            // damage control: only valid on shields that have taken damage,
            // and capped ship-wide by the sum of intact damageCon box
            // values - not a power cost, so this is validated separately
            // from the power budget below rather than folded into it
            var damageControl = [0, 0, 0, 0, 0, 0, 0]; // 1-indexed, [0] unused
            var damageControlTotal = 0;
            for (var dcS = 1; dcS <= 6; dcS++) {
                var $dcInp = $('#eaDamageControl' + dcS);
                if ($dcInp.length) {
                    var dcV = parseInt($dcInp.val()) || 0;
                    if (dcV > 0 && internals['shield' + dcS] >= internals['mShield' + dcS]) {
                        alert('Cannot repair shield #' + dcS + ' - it has not taken any damage');
                        return;
                    }
                    damageControl[dcS] = dcV;
                    damageControlTotal += dcV;
                }
            }
            var damageConAvailable = getDamageConMax(internals);
            if (damageControlTotal > damageConAvailable) {
                alert('Allocated damage control (' + damageControlTotal + ') exceeds available damage control (' + damageConAvailable + ')');
                return;
            }

            if (discharge > internals.batteryStored) {
                alert('Cannot discharge more than stored battery charge (' + internals.batteryStored + ')');
                return;
            }
            if (recharge > (internals.mBty - internals.batteryStored)) {
                alert('Recharge exceeds battery headroom (' + (internals.mBty - internals.batteryStored) + ')');
                return;
            }
            if (phaserAdd > (ship.maxPhaserCap - ship.phaserCap)) {
                alert('Phaser capacitor add exceeds headroom (' + (ship.maxPhaserCap - ship.phaserCap) + ')');
                return;
            }
            if (speed > maxSpeed) {
                alert('Speed (' + speed + ') exceeds the max allowed from warp + impulse (' + maxSpeed + ')');
                return;
            }

            // collect which heavy weapons are being newly armed this turn (and how)
            var newArming = computeNewArming(sId);
            var photonLoading = computePhotonLoadingInputs(sId);
            var droneReload = computeDroneReloadInputs(sId);

            // validate each photon round input against its per-round min/max
            for (var i = 0; i < photonLoading.entries.length; i++) {
                var entry = photonLoading.entries[i];
                if (entry.kind != 'round') continue;
                var wEntry = ship.shipWeapons[entry.index];
                var maxThisRound = (wEntry.loadRounds == 0) ? PHOTON_ROUND_MAX : Math.min(PHOTON_ROUND_MAX, PHOTON_TOTAL_MAX - wEntry.investedPower);
                if (entry.amount < PHOTON_ROUND_MIN || entry.amount > maxThisRound) {
                    alert('Photon loading amount must be between ' + PHOTON_ROUND_MIN + ' and ' + maxThisRound + ' this round');
                    return;
                }
            }

            // validate top-up amounts on held photons (additional power added
            // while maintaining, to push a normal load into overload)
            for (var i = 0; i < photonLoading.entries.length; i++) {
                var entry = photonLoading.entries[i];
                if (entry.kind != 'maintain' || !entry.topup) continue;
                var wEntry = ship.shipWeapons[entry.index];
                var maxTopUp = PHOTON_TOTAL_MAX - wEntry.investedPower;
                if (entry.topup < 0 || entry.topup > maxTopUp) {
                    alert('Photon top-up amount must be between 0 and ' + maxTopUp + ' this turn');
                    return;
                }
            }

            // photon loading must come from warp specifically. Speed draws
            // from warp too (beyond the 1pt impulse allowance), so we
            // assume the free impulse point covers speed first and warp
            // covers the rest, to check remaining warp headroom.
            var warpUsedForSpeed = Math.max(0, speed - Math.min(1, impAvail));
            var warpRemaining = warpAvail - warpUsedForSpeed;
            if (photonLoading.warpCost > warpRemaining) {
                alert('Photon loading requires warp power specifically - only ' + warpRemaining + ' warp remaining after speed');
                return;
            }

            var available = generated + discharge;
            var used = LIFE_SUPPORT_COST + FIRE_CONTROL_COST + phaserAdd + recharge + speed
                + newArming.totalCost
                + photonLoading.totalCost
                + generalReinforcePower
                + specificReinforceCost
                + (shieldsActive ? SHIELD_ACTIVATION_COST : 0);

            if (used > available) {
                alert('Allocated power (' + used + ') exceeds available power (' + available + ')');
                return;
            }

            // apply everything
            internals.batteryStored = internals.batteryStored - discharge + recharge;
            ship.phaserCap = ship.phaserCap + phaserAdd;
            ship.speed = speed;
            internals.generalReinforcement = Math.floor(generalReinforcePower / GENERAL_REINFORCEMENT_COST); // doesn't carry over - always a fresh value, not additive
            for (var s = 1; s <= 6; s++) {
                internals['specificShield' + s] = specificReinforce[s]; // same - fresh each turn
            }
            for (var dcS = 1; dcS <= 6; dcS++) {
                internals['damageControlShield' + dcS] = damageControl[dcS]; // applied and reset in endTurn() ("end of the round")
            }
            for (var i = 0; i < newArming.entries.length; i++) {
                ship.shipWeapons[newArming.entries[i].index].bArmed = true;
                ship.shipWeapons[newArming.entries[i].index].loadType = newArming.entries[i].loadType;
            }
            if (shieldsActive) {
                restoreShields(iArrId);
            } else {
                dropShields(iArrId);
            }

            var photonDischarged = 0, photonAdvanced = 0, photonMaintained = 0, photonToppedUp = 0;
            for (var i = 0; i < photonLoading.entries.length; i++) {
                var entry = photonLoading.entries[i];
                var wEntry = ship.shipWeapons[entry.index];
                if (entry.kind == 'round') {
                    wEntry.investedPower += entry.amount;
                    wEntry.loadRounds += 1;
                    photonAdvanced++;
                    if (wEntry.loadRounds == 2) {
                        wEntry.bArmed = true;
                        wEntry.armedTurnNumber = turnNumber;
                        wEntry.loadType = (wEntry.investedPower > PHOTON_NORMAL_TOTAL) ? 'overload' : 'normal';
                    }
                } else if (entry.kind == 'maintain') {
                    if (entry.topup > 0) {
                        wEntry.investedPower += entry.topup;
                        wEntry.loadType = (wEntry.investedPower > PHOTON_NORMAL_TOTAL) ? 'overload' : 'normal';
                        photonToppedUp++;
                    }
                    photonMaintained++;
                } else if (entry.kind == 'discharge') {
                    wEntry.loadRounds = 0;
                    wEntry.investedPower = 0;
                    wEntry.bArmed = false;
                    wEntry.loadType = null;
                    wEntry.armedTurnNumber = null;
                    photonDischarged++;
                }
            }

            // drone reloads: each checked rack draws from the shared ship
            // stockpile, in the order racks appear on the ship. Free (no
            // power cost) but disables the rack for the rest of this turn.
            // Processed sequentially so that if the stockpile can't cover
            // every checked rack, earlier racks in the list get priority
            // instead of anything failing outright.
            var dronesReloaded = 0, racksReloaded = 0;
            var reloadParts = [];
            for (var i = 0; i < droneReload.entries.length; i++) {
                var entry = droneReload.entries[i];
                var wEntry = ship.shipWeapons[entry.index];
                var reloadResult = applyDroneReload(wEntry, ship, DRONE_RELOAD_AMOUNT, entry.chosenType);
                wEntry.bReloading = true; // disabled for the rest of this turn regardless of whether stockpile covered it
                racksReloaded++;
                var addedCount = droneLoadoutCount(reloadResult.added);
                dronesReloaded += addedCount;
                if (addedCount > 0) {
                    var addedParts = [];
                    for (var t in reloadResult.added) { addedParts.push('+' + reloadResult.added[t] + ' ' + t); }
                    reloadParts.push('[' + (entry.index + 1) + '] ' + addedParts.join(' '));
                }
            }

            var logMsg = ship.name + ' allocates energy: speed ' + speed + ', phaser cap +' + phaserAdd + ' (now ' + ship.phaserCap + '/' + ship.maxPhaserCap + ')';
            logMsg += ', shields ' + (shieldsActive ? 'active' : 'DROPPED');
            if (generalReinforcePower > 0) logMsg += ', general reinforcement +' + internals.generalReinforcement + ' pts (' + generalReinforcePower + ' power)';
            var specificParts = [];
            for (var s = 1; s <= 6; s++) { if (specificReinforce[s] > 0) specificParts.push('#' + s + '+' + specificReinforce[s]); }
            if (specificParts.length > 0) logMsg += ', specific reinforcement ' + specificParts.join(' ');
            var damageControlParts = [];
            for (var dcS = 1; dcS <= 6; dcS++) { if (damageControl[dcS] > 0) damageControlParts.push('#' + dcS + '+' + damageControl[dcS] + 'pt(repairs ' + Math.floor(damageControl[dcS] / 2) + ')'); }
            if (damageControlParts.length > 0) logMsg += ', damage control ' + damageControlParts.join(' ') + ' - applied end of round';
            if (newArming.entries.length > 0) logMsg += ', armed ' + newArming.entries.length + ' heavy weapon(s)';
            if (photonAdvanced > 0) logMsg += ', advanced ' + photonAdvanced + ' photon load(s)';
            if (photonMaintained > 0) logMsg += ', maintained ' + photonMaintained + ' photon charge(s)';
            if (photonToppedUp > 0) logMsg += ', ' + photonToppedUp + ' photon(s) topped up toward overload';
            if (photonDischarged > 0) logMsg += ', ' + photonDischarged + ' photon(s) DISCHARGED (no maintenance paid)';
            if (racksReloaded > 0) logMsg += ', ' + racksReloaded + ' drone rack(s) reloading (' + (reloadParts.length > 0 ? reloadParts.join('; ') + ', ' : '') + 'stockpile ' + formatDroneLoadout(ship.droneStockpile, ship.droneStockpileSpaceMax) + ')';
            logMsg += ', battery ' + internals.batteryStored + '/' + internals.mBty;
            $('#dataDiv').append('<div>' + logMsg + '</div>');

            $('#energyAllocPopUpDiv').css('display', 'none');
            energyAllocList.shift();
            allocateNextShip();
        }


        function currentAbsoluteImpulse() {
            return (turnNumber - 1) * IMPULSES_PER_TURN + impulse;
        }

        // converts an absolute impulse count back into {turn, impulse} for
        // display purposes (e.g. "ready again on turn 2, impulse 6")
        function absoluteImpulseToTurnImpulse(absImpulse) {
            var turn = Math.floor((absImpulse - 1) / IMPULSES_PER_TURN) + 1;
            var imp = ((absImpulse - 1) % IMPULSES_PER_TURN) + 1;
            return { turn: turn, impulse: imp };
        }

        function weaponReady(weaponEntry) {
            if (weaponEntry.bDestroyed) return false;
            // ADD racks fire every impulse with no cooldown at all - not
            // even the once-per-turn limit every other weapon (including
            // Phaser-G) is still subject to below
            if (weaponEntry.weaponClassId == ADD_WEAPON_CLASS_ID) return true;
            // Drone-G: firing in ADD mode this turn locks out drone-launch
            // mode for the rest of the turn too (mutual exclusivity) - even
            // though ADD mode itself has no cooldown. This only checks the
            // drone-launch side; ADD-mode eligibility on Drone-G is handled
            // separately in fireADD()/chooseDroneTypeAndFire(), since it
            // needs the opposite exemption from the recycle check below.
            if (weaponEntry.weaponTypeId == DRONE_G_WEAPON_TYPE_ID && weaponEntry.addFiredThisTurn) return false;
            // once per turn always applies, to every weapon including Phaser-G
            if (weaponEntry.bFired) return false;
            // Phaser-G is exempt from the extra cross-turn-boundary delay below,
            // but still subject to the once-per-turn check above
            if (weaponEntry.weaponTypeId == PHASER_G_WEAPON_TYPE_ID) return true;
            if (weaponEntry.lastFiredAbsImpulse == null) return true;
            // this only actually restricts anything when the weapon fired late
            // enough last turn (impulse 25+) that 8 impulses hadn't yet passed
            // by the time the turn rolled over - it exists purely to stop
            // firing at the very end of one turn and the very start of the next
            return (currentAbsoluteImpulse() - weaponEntry.lastFiredAbsImpulse) >= WEAPON_RECYCLE_IMPULSES;
        }

        function shieldFacing(arc) {
            var s = 1;
            if (arc > 30 && arc <= 90) s = 2;
            if (arc > 90 && arc <= 150) s = 3;
            if (arc > 150 && arc <= 210) s = 4;
            if (arc > 210 && arc <= 270) s = 5;
            if (arc > 270 && arc <= 330) s = 6;
            return s;
        }

        // range-0 shield calculation: unlike normal-range fire, at range 0
        // there's no meaningful bearing between two ships sharing a hex, so
        // the shield hit has to be derived from the relationship between
        // the weapon's own world-frame facing and the TARGET's own facing
        // (shields rotate with the target's heading, same as normal-range
        // fire, but here we have to compute it explicitly instead of
        // getting it "for free" from a real bearing).
        //
        // Works in 60-degree steps (0-5) rather than continuous degrees:
        // shield = (weaponWorldSteps - targetFacingSteps + 4), wrapped into
        // the 1-6 range. The "+4" constant (rather than the more intuitive
        // "+1", i.e. dead-astern-of-target = front-facing weapon) was found
        // by solving against two known test cases; if a future case doesn't
        // match, this constant is the first place to check.
        function stepsFromFacing(deg) {
            return Math.round(deg / 60) % 6;
        }
        function wrapShield1to6(n) {
            while (n < 1) n += 6;
            while (n > 6) n -= 6;
            return n;
        }
        function rangeZeroShieldFacing(weaponWorldFacing, targetFacing) {
            var weaponSteps = stepsFromFacing(weaponWorldFacing);
            var targetSteps = stepsFromFacing(targetFacing);
            return wrapShield1to6(weaponSteps - targetSteps + 4);
        }

        function findFacing(selShip, tarShip) {
            var arrId1 = -1;
            var arrId2 = -2;
            for (var z = 0; z < shipList.length; z++) {
                if (shipList[z].userId == selShip) { arrId1 = z; }
                if (shipList[z].userId == tarShip) { arrId2 = z; }
            }

            var x1 = shipList[arrId1].xCord; var x2 = shipList[arrId2].xCord;
            var y1 = shipList[arrId1].yCord; var y2 = shipList[arrId2].yCord;
            var dx = (x2 - x1);
            var dy = (y2 - y1);
            var mx = dx * 0.866;
            var my = -dy;
            if ((x1 % 2 == 0) && ((x2 % 2) == 1)) my += 0.5;
            if ((x1 % 2 == 1) && ((x2 % 2) == 0)) my -= 0.5;

            //var s = '<div>selShip=' + selShip + ' x=' + shipList[arrId1].xCord + ' y=' + shipList[arrId1].yCord + ' f=' + shipList[arrId1].facing + '</div>';
            //s += '<div> tarShip=' + tarShip + ' x=' + shipList[arrId2].xCord + ' y=' + shipList[arrId2].yCord + '</div>';

            var angle = Math.round(Math.atan2(my, mx) * (180 / Math.PI) * 100) / 100;
            if (angle > 90)
                angle = 450 - angle;
            else
                angle = 90 - angle;
            angle -= shipList[arrId1].facing;
            if (angle >= 360) angle -= 360;
            if (angle < 0) angle += 360;

            //s += '<div>dx' + dx + ' dy=' + dy + '  mx=' + mx + ' my' + my + ' a=' + angle + '</div>';
            //$('#dataDiv').append(s);
            return angle;
        }

        function rollD6() {
            var n = (Math.floor(Math.random() * 6) + 1);
            return n;
        }
        function roll2D6() {
            var n = ((Math.floor(Math.random() * 6) + 1) + (Math.floor(Math.random() * 6) + 1));
            return n;
        }

        // --- picking a target when multiple ships/drones share a hex ---

        // every ship and active (non-destroyed) drone sitting at a given hex
        function getEntitiesAtHex(xCord, yCord) {
            var entities = [];
            for (var z = 0; z < shipList.length; z++) {
                if (shipList[z].xCord == xCord && shipList[z].yCord == yCord) {
                    entities.push({ type: 'ship', id: shipList[z].userId, label: shipList[z].name + ' [' + shipList[z].userId + ']' });
                }
            }
            for (var i = 0; i < activeDrones.length; i++) {
                if (!activeDrones[i].bDestroyed && activeDrones[i].xCord == xCord && activeDrones[i].yCord == yCord) {
                    entities.push({ type: 'drone', id: activeDrones[i].id, label: 'Drone #' + activeDrones[i].id });
                }
            }
            return entities;
        }

        // single entry point for clicking a ship icon or drone marker.
        // If only one thing occupies that hex, behaves exactly as before
        // (no extra step for the common case). If more than one thing is
        // stacked there, shows a small picker instead of blindly acting on
        // whichever marker happened to be on top / clickable.
        function hexEntityClick(type, id) {
            var xCord, yCord;
            if (type == 'ship') {
                for (var z = 0; z < shipList.length; z++) {
                    if (shipList[z].userId == id) { xCord = shipList[z].xCord; yCord = shipList[z].yCord; }
                }
            } else {
                for (var i = 0; i < activeDrones.length; i++) {
                    if (activeDrones[i].id == id) { xCord = activeDrones[i].xCord; yCord = activeDrones[i].yCord; }
                }
            }

            var entities = getEntitiesAtHex(xCord, yCord);
            if (entities.length <= 1) {
                selectHexEntity(type, id);
                return;
            }

            $('#hexPickerBackdrop').css('display', 'block');
            var str = '<div style="float:left;">Select target:</div>';
            str += '<div style="float:right;" onclick="closePopup(\'hexPicker\');"><i class="fa-light fa-circle-xmark"></i></div>';
            str += '<div style="clear:both;"></div>';
            for (var i = 0; i < entities.length; i++) {
                str += '<div class="button" style="float:none;margin:4px 0;" onclick="closePopup(\'hexPicker\');selectHexEntity(\'' + entities[i].type + '\',' + entities[i].id + ');">' + entities[i].label + '</div>';
            }
            $('#hexPickerPopUpDiv').html(str).css('display', 'block');
        }

        // dispatches to the same handlers that used to be wired directly
        // to the marker's onclick, once we know which single entity was
        // actually meant
        function selectHexEntity(type, id) {
            if (type == 'ship') { shipData(id); }
            else { droneClick(id); }
        }

        function shipData(sId) {
            if (sId != curShipId)
                shipClick(sId);
            else
                showShipPopUp(sId);

            //var str = '';
            //$('#dataDiv').html(str);
        }


        function makeDraggableElement(el) {
            if (!el) {
                console.warn('makeDraggableElement called with a missing element (getElementById returned null) — skipping.');
                return;
            }
            var x1 = 0;
            var y1 = 0;
            var x2 = 0;
            var y2 = 0;

            el.onmousedown = dragMouseDown;

            function dragMouseDown(e) {
                e = e || window.event;
                x2 = e.clientX;
                y2 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
            }

            function elementDrag(e) {
                e = e || window.event;
                x1 = x2 - e.clientX;
                y1 = y2 - e.clientY;
                x2 = e.clientX;
                y2 = e.clientY;
                el.style.top = (el.offsetTop - y1) + 'px';
                el.style.left = (el.offsetLeft - x1) + 'px';
            }

            function closeDragElement() {
                document.onmousetop = null;
                document.onmousemove = null;
            }
        }


        function speedSort(a, b) {
            var speedA = parseInt(a.speed);
            var speedB = parseInt(b.speed);

            if (speedA < speedB)
                return -1;
            if (speedA > speedB)
                return 1;
            return 0;
        }
