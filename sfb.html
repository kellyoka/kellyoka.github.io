        // entry point for clicking "Fire" on a drone rack. If the rack
        // holds only one type, there's nothing to ask - fire immediately.
        // If it holds a mix, show a quick chooser (in place of the normal
        // fire list) and only actually launch once a type is picked -
        // selection happens AFTER the player commits to firing this rack,
        // not as a standing dropdown before they've clicked anything.
        function chooseDroneTypeAndFire(sArrId, wArrId, tsId, arc, targetType) {
            var rack = shipList[sArrId].shipWeapons[wArrId];
            var typesPresent = [];
            for (var t in rack.droneLoadout) { if (rack.droneLoadout[t] > 0) typesPresent.push(t); }

            // ADD-Charge (Drone-G's hybrid ammo) can only ever be used
            // against a drone or a sizeClass-6 ship, same restriction
            // dedicated ADD racks are held to - filter it out of the
            // choices entirely when the current target doesn't qualify
            if (typesPresent.indexOf('ADD-Charge') != -1) {
                var addValidTarget = true;
                if (targetType == 'ship') {
                    var tArrId = -1;
                    for (var z = 0; z < shipList.length; z++) { if (shipList[z].userId == tsId) { tArrId = z; } }
                    addValidTarget = (tArrId != -1 && shipList[tArrId].sizeClass == 6);
                }
                if (!addValidTarget) {
                    typesPresent = typesPresent.filter(function (t) { return t != 'ADD-Charge'; });
                }
            }

            if (typesPresent.length == 0) {
                var strEmpty = '<div>No usable ammo for this target.</div>';
                strEmpty += '<div class="button" style="margin-top:8px;" onclick="shipFirePopUp();">Back</div>';
                $('#fireShipPopUpDiv').html(strEmpty).css('display', 'block');
                return;
            }

            if (typesPresent.length <= 1) {
                var onlyType = typesPresent[0];
                if (onlyType == 'ADD-Charge') {
                    fireADD(sArrId, wArrId, targetType, tsId, arc);
                } else {
                    fireWeapon(sArrId, wArrId, tsId, arc, targetType, onlyType);
                }
                return;
            }

            var str = '<div style="font-weight:bold;">Choose drone type to fire:</div>';
            for (var i = 0; i < typesPresent.length; i++) {
                var t = typesPresent[i];
                var onclickCall = (t == 'ADD-Charge')
                    ? 'fireADD(' + sArrId + ',' + wArrId + ',\'' + targetType + '\',' + tsId + ',' + arc + ');'
                    : 'fireWeapon(' + sArrId + ',' + wArrId + ',' + tsId + ',' + arc + ',\'' + targetType + '\',\'' + t + '\');';
                str += '<div class="weaponFireDiv canTargetHighlight" onclick="' + onclickCall + '">' + t + ' x' + rack.droneLoadout[t] + '</div>';
            }
            str += '<div class="button" style="margin-top:8px;" onclick="shipFirePopUp();">Cancel</div>';
            $('#fireShipPopUpDiv').html(str).css('display', 'block');
        }

        function fireWeapon(sArrId, wArrId, tsId, arc, targetType, chosenType) {
            targetType = targetType || 'ship'; // existing callers only ever target ships, so default preserves them
            var wClass = 0;
            var weapon = null;
            shipList[sArrId].shipWeapons[wArrId].bFired = true;
            shipList[sArrId].shipWeapons[wArrId].impFired = impulse;
            shipList[sArrId].shipWeapons[wArrId].lastFiredAbsImpulse = currentAbsoluteImpulse();
            for (var y = 0; y < weaponList.length; y++) {
                if (weaponList[y].weaponTypeId == shipList[sArrId].shipWeapons[wArrId].weaponTypeId) {
                    if (weaponList[y].weaponClassId == 1)
                        shipList[sArrId].phaserCap -= weaponList[y].powerCost;
                    if (isHeavyWeaponClass(weaponList[y].weaponClassId)) {
                        shipList[sArrId].shipWeapons[wArrId].bArmed = false; // firing consumes the arming - needs re-arming next turn
                        shipList[sArrId].shipWeapons[wArrId].loadType = null;
                        shipList[sArrId].shipWeapons[wArrId].loadRounds = 0;
                        shipList[sArrId].shipWeapons[wArrId].investedPower = 0;
                        shipList[sArrId].shipWeapons[wArrId].armedTurnNumber = null;
                    }
                    wClass = weaponList[y].weaponClassId;
                    weapon = weaponList[y];
                }
            }

            if (wClass == 4) {
                // seeking weapon (drone): launch a tracked object instead of
                // resolving an instant hit. chosenType comes from
                // chooseDroneTypeAndFire() when the rack holds a mix of
                // types (it prompts before calling back in here); with
                // only one type present there's nothing to choose, so fall
                // back to it automatically.
                var rack = shipList[sArrId].shipWeapons[wArrId];
                var finalType = chosenType;
                if (!finalType) {
                    for (var t in rack.droneLoadout) {
                        if (rack.droneLoadout[t] > 0) { finalType = t; break; }
                    }
                }
                launchDrone(sArrId, wArrId, targetType, tsId, weapon, finalType);
                shipFirePopUp();
                return;
            }

            var h = findDist(curShipId, tsId);
            var r = 0;
            var d = 0;
            var bHit = false;
            var target = 0;
            //var str = '<div>wClass=' + wClass + ' dam=' + d + '</div>';
            var str = '';
            if (wClass == 1) {
                // phasers: hits[roll-1] is the damage dealt directly
                r = rollD6();
                var hits = getDamage(weapon, h);
                d = hits[r - 1];
                //str += '<div>h=' + h + ' r=' + r + ' d=' + d + '</div>';
            }
            if (wClass == 2) {
                // disruptors/photons: hits[0] is the to-hit threshold.
                // Disruptors: hits[1] normal damage, hits[2] overload damage
                // (already present in the data). Photon: damage is always
                // investedPower*2 - this naturally reproduces the normal
                // case too, since normal load is always exactly 4 power
                // (4*2=8, matching the existing fixed damage value).
                r = rollD6();
                var hits = getDamage(weapon, h);
                var thisWeaponEntry = shipList[sArrId].shipWeapons[wArrId];
                var isOverload = (thisWeaponEntry.loadType == 'overload');
                if (hits[0] >= r) {
                    if (isPhotonWeaponTypeId(weapon.weaponTypeId)) {
                        d = thisWeaponEntry.investedPower * 2;
                    } else {
                        d = isOverload ? (hits[2] || 0) : hits[1];
                    }
                }
                //str += '<div>h=' + h + ' r=' + r + ' d=' + d + '</div>';
            }

            var attackerName = shipList[sArrId].name;
            var targetName = '';
            var targetFacing = 0;
            for (var zz = 0; zz < shipList.length; zz++) {
                if (shipList[zz].userId == tsId) { targetName = shipList[zz].name; targetFacing = shipList[zz].facing; }
            }

            // at range 0 there's no meaningful bearing between ships sharing
            // a hex - dx/dy are both 0, so findFacing() degenerates to a
            // fixed, arbitrary value based only on the attacker's own
            // facing, regardless of which weapon is actually firing. So at
            // range 0, the shield struck is based on this weapon's own
            // mounted facing (and the target's own facing - see
            // rangeZeroShieldFacing) instead - and weapons whose arcs
            // overlap with one already fired this turn join that same
            // shield, so e.g. firing 2 FA phasers + 2 360 phasers together
            // lands all four on the same shield, while FA + RA phasers
            // correctly split across two different shields.
            var shieldNum;
            var weaponFacing = null;
            if (h == 0) {
                var thisWeapon = shipList[sArrId].shipWeapons[wArrId];
                var thisStart = ((shipList[sArrId].facing + thisWeapon.startP) % 360 + 360) % 360;
                var thisArc = thisWeapon.arc;

                if (thisArc >= 360) {
                    // omnidirectional weapon - no natural center, default to straight ahead
                    weaponFacing = shipList[sArrId].facing;
                } else {
                    weaponFacing = thisStart + (thisArc / 2);
                }
                weaponFacing = ((weaponFacing % 360) + 360) % 360;

                var joined = false;
                for (var g = 0; g < currentFirerShieldGroups.length; g++) {
                    if (arcsOverlap(thisStart, thisArc, currentFirerShieldGroups[g].start, currentFirerShieldGroups[g].arc)) {
                        shieldNum = currentFirerShieldGroups[g].shield;
                        joined = true;
                        break;
                    }
                }
                if (!joined) {
                    shieldNum = rangeZeroShieldFacing(weaponFacing, targetFacing);
                    currentFirerShieldGroups.push({ shield: shieldNum, start: thisStart, arc: thisArc });
                }
            } else {
                // shield facing must be computed from the TARGET's own
                // perspective (bearing from target to firer, relative to
                // the target's own facing) - NOT the attacker-relative
                // "arc" value, which is only valid for checking whether
                // the target is within this weapon's firing arc. Using
                // "arc" here was a bug: it silently matched shipClick()'s
                // "Enemy hit shield" figure instead of "I hit shield".
                var shieldFacingBearing = findFacing(tsId, shipList[sArrId].userId);
                shieldNum = shieldFacing(shieldFacingBearing);
            }

            var rollStr = '<div>' + attackerName + ' - ' + targetName + '  ' + weapon.weaponName + ' roll ' + r;
            rollStr += (d > 0) ? (' -- ' + d + ' damage to shield #' + shieldNum) : ' miss';
            rollStr += '</div>';
            $('#dataDiv').append(rollStr);

            if (d > 0) {
                var bAdded = false;
                for (var z = 0; z < damageList.length; z++) {
                    if (damageList[z].targetId == tsId && damageList[z].shield == shieldNum) {
                        damageList[z].damage += d;
                        bAdded = true;
                    }
                }
                if (!bAdded) {
                    damageList[damageList.length] = new damageListType(tsId, shieldNum, d);
                }

                // overloaded heavy weapons take feedback damage on certain
                // close-range shots - "as if the target fired back". For
                // disruptors: range 0 only, flat 2 damage. For photon:
                // ranges 0-1, damage = investedPower - 4 (1 to 4).
                var feedbackDamage = 0;
                var thisEntry = shipList[sArrId].shipWeapons[wArrId];
                if (h == 0 && isDisruptorWeaponTypeId(weapon.weaponTypeId) && thisEntry.loadType == 'overload') {
                    feedbackDamage = DISRUPTOR_OVERLOAD_FEEDBACK_DAMAGE;
                } else if ((h == 0 || h == 1) && isPhotonWeaponTypeId(weapon.weaponTypeId) && thisEntry.loadType == 'overload') {
                    feedbackDamage = thisEntry.investedPower - PHOTON_NORMAL_TOTAL;
                }
                if (feedbackDamage > 0) {
                    // feedback shield: as if the target fired back at the
                    // firer using its own dead-ahead facing - not based on
                    // the original weapon or the firer's own facing at all
                    var feedbackShield = rangeZeroShieldFacing(targetFacing, shipList[sArrId].facing);
                    var firerId = shipList[sArrId].userId;
                    $('#dataDiv').append('<div>' + attackerName + '\'s overloaded ' + weapon.weaponName + ' feeds back ' + feedbackDamage + ' damage to its own shield #' + feedbackShield + '</div>');
                    var bAddedFeedback = false;
                    for (var z = 0; z < damageList.length; z++) {
                        if (damageList[z].targetId == firerId && damageList[z].shield == feedbackShield) {
                            damageList[z].damage += feedbackDamage;
                            bAddedFeedback = true;
                        }
                    }
                    if (!bAddedFeedback) {
                        damageList[damageList.length] = new damageListType(firerId, feedbackShield, feedbackDamage);
                    }
                }
            }

            shipFirePopUp();
            //str += '<div style="padding-bottom:10px">curShipId=' + curShipId + ' w=' + wArrId + ' ' + damageList.length + '</div>';
            //$('#dataDiv').append(str);
        }

        // fire a direct-fire weapon (phaser/disruptor) at a drone instead of
        // a ship. Drones have no shields, so damage applies straight to
        // hit points instead of going through the shield/armor/DAC pipeline.
        // launches a shuttle from its mothership's hangar - triggered as an
        // action in the fire popup (see shipFirePopUp()'s hangar button).
        // The new shuttle spawns at the mothership's current position and
        // facing, with 0 speed until its own (minimal) energy allocation
        // sets one next turn - see showEnergyAllocPopUp()'s isShuttle
        // bypass. It's a real shipList entry (so it gets full move/fire
        // queue participation for free), but flat-HP (see applyDamage()'s
        // isShuttle bypass) with no shipInternals entry at all - it never
        // goes through shields/DAC/energy allocation.
        function launchShuttle(sArrId) {
            var mothership = shipList[sArrId];
            if (mothership.shuttleHangar <= 0) return;

            mothership.shuttleHangar -= 1;
            var shuttleNum = mothership.shuttleHangarMax - mothership.shuttleHangar;
            var shuttle = new shipType(nextShuttleUserId++, mothership.name + ' Shuttle ' + shuttleNum, mothership.xCord, mothership.yCord, mothership.facing, SHUTTLE_TURN_MODE, SHUTTLE_SPEED, 1, 6);
            shuttle.isShuttle = true;
            shuttle.ownerShipId = mothership.userId;
            shuttle.team = mothership.team;
            shuttle.hitPoints = SHUTTLE_HITPOINTS;
            shuttle.maxHitPoints = SHUTTLE_HITPOINTS;
            shuttle.shipWeapons[0] = new weaponEntryType(1, SHUTTLE_PHASER_WEAPON_TYPE_ID, 1, 0, 360, 0, 0);
            shipList.push(shuttle);

            // ships 1/2 (and the reserved-for-later 3-9) have their marker
            // divs pre-built into the static page; a shuttle needs its
            // marker created dynamically instead, same idea as
            // plotSeekingWeapon() does for drones. Uses the mothership's
            // own icon/background color so it visually reads as "one of
            // this ship's shuttles" - scaled down a bit so it also reads
            // as smaller than a full ship.
            var markerStr = '<div id="ship' + shuttle.userId + '" class="shipDiv" style="background-color:' + mothership.shuttleBgColor + ';transform:scale(0.7);" onclick="hexEntityClick(\'ship\', ' + shuttle.userId + ');"><img src="' + mothership.shuttleIconSrc + '" class="nav-icon-path" /></div>';
            $('#shipLayer').append(markerStr);
            plotShip(shuttle.userId); // reuse the normal positioning math now that the marker div exists

            $('#dataDiv').append('<div>' + mothership.name + ' launches ' + shuttle.name + ' (' + mothership.shuttleHangar + '/' + mothership.shuttleHangarMax + ' remaining in hangar)</div>');

            // it launched before this impulse's direct-fire phase (step 10)
            // runs, so let it get a chance to fire too, same impulse
            fireShipList.push(shuttle.userId);

            shuttleLaunchCounts[mothership.userId] = (shuttleLaunchCounts[mothership.userId] || 0) + 1;
            if (shuttleLaunchCounts[mothership.userId] >= mothership.shuttleOpsPerImpulse) {
                doneLaunchShuttlecraft(); // hit this impulse's limit - move on to the next ship
            } else {
                launchShuttlecraftPopUp(mothership.userId); // still has launches left this impulse - offer another
            }
        }

        // docks a shuttle back with its mothership - only available when
        // they're in the exact same hex, no speed restriction. Undoes
        // launchShuttle(): removes the shipList entry and any leftover
        // queue references, restores one hangar slot on the mothership.
        function dockShuttle(sArrId) {
            var shuttle = shipList[sArrId];
            if (!shuttle.isShuttle) return;
            var motherArrId = findShipArrId(shuttle.ownerShipId);
            if (motherArrId == -1) return;
            var mothership = shipList[motherArrId];
            if (findDist(shuttle.userId, mothership.userId) > 0) return;

            mothership.shuttleHangar = Math.min(mothership.shuttleHangarMax, mothership.shuttleHangar + 1);
            shuttleDockCounts[mothership.userId] = (shuttleDockCounts[mothership.userId] || 0) + 1;
            $('#dataDiv').append('<div>' + shuttle.name + ' docks with ' + mothership.name + ' (' + mothership.shuttleHangar + '/' + mothership.shuttleHangarMax + ' in hangar)</div>');

            // any drone still homing in on this shuttle switches to
            // pursuing the mothership it just docked with, instead of
            // losing its target and self-destructing (see
            // moveSeekingWeapon()'s target-gone bypass) - done BEFORE the
            // shuttle is removed, so the retarget is in place before
            // anything checks whether its old target still exists
            for (var di = 0; di < activeDrones.length; di++) {
                var d = activeDrones[di];
                if (!d.bDestroyed && d.targetType == 'ship' && d.targetId == shuttle.userId) {
                    d.targetId = mothership.userId;
                    $('#dataDiv').append('<div>' + (d.droneTypeName || 'Drone') + ' #' + d.id + ' retargets ' + mothership.name + ' as ' + shuttle.name + ' docks</div>');
                }
            }

            removeShipEntirely(shuttle.userId);
            doneRecoverShuttlecraft(); // the shuttle just docked is gone - move on to the next eligible one
        }

        function removeShipMarker(sId) {
            $('#ship' + sId).remove();
            updateStackBadges();
        }

        // removes a ship/shuttle from shipList and every queue it might
        // still be sitting in - used for docking and for shuttle
        // destruction (see applyDamage()'s isShuttle bypass)
        function removeShipEntirely(sId) {
            // splice out of shipList BEFORE removing the marker/updating
            // stack badges - updateStackBadges() counts hexes from the
            // current shipList, so doing this in the other order left it
            // counting the just-destroyed entity for one extra badge
            // refresh (stale by one, e.g. showing "2" in a hex that only
            // has 1 ship left after the other one there is destroyed)
            var arrId = findShipArrId(sId);
            if (arrId != -1) shipList.splice(arrId, 1);
            removeShipMarker(sId);
            moveShipList = moveShipList.filter(function (id) { return id != sId; });
            fireShipList = fireShipList.filter(function (id) { return id != sId; });
            energyAllocList = energyAllocList.filter(function (id) { return id != sId; });
        }

        function fireWeaponAtDrone(sArrId, wArrId, droneId, arc) {
            var wClass = 0;
            var weapon = null;
            shipList[sArrId].shipWeapons[wArrId].bFired = true;
            shipList[sArrId].shipWeapons[wArrId].impFired = impulse;
            shipList[sArrId].shipWeapons[wArrId].lastFiredAbsImpulse = currentAbsoluteImpulse();
            for (var y = 0; y < weaponList.length; y++) {
                if (weaponList[y].weaponTypeId == shipList[sArrId].shipWeapons[wArrId].weaponTypeId) {
                    if (weaponList[y].weaponClassId == 1)
                        shipList[sArrId].phaserCap -= weaponList[y].powerCost;
                    if (isHeavyWeaponClass(weaponList[y].weaponClassId)) {
                        shipList[sArrId].shipWeapons[wArrId].bArmed = false;
                        shipList[sArrId].shipWeapons[wArrId].loadType = null;
                        shipList[sArrId].shipWeapons[wArrId].loadRounds = 0;
                        shipList[sArrId].shipWeapons[wArrId].investedPower = 0;
                        shipList[sArrId].shipWeapons[wArrId].armedTurnNumber = null;
                    }
                    wClass = weaponList[y].weaponClassId;
                    weapon = weaponList[y];
                }
            }

            var drone = null;
            for (var i = 0; i < activeDrones.length; i++) {
                if (activeDrones[i].id == droneId) { drone = activeDrones[i]; }
            }
            if (!drone || drone.bDestroyed) { shipFirePopUp(); return; }

            var h = findDistToDrone(curShipId, droneId);
            var r = 0;
            var d = 0;
            if (wClass == 1) {
                r = rollD6();
                var hits = getDamage(weapon, h);
                d = hits[r - 1];
            } else if (wClass == 2) {
                r = rollD6();
                var hits = getDamage(weapon, h);
                if (hits[0] >= r) { d = hits[1]; }
            }

            var attackerName = shipList[sArrId].name;
            var rollStr = '<div>' + attackerName + ' - Drone #' + drone.id + '  ' + weapon.weaponName + ' roll ' + r;
            if (d > 0) {
                drone.hitPoints -= d;
                rollStr += ' -- ' + d + ' damage to drone (HP ' + Math.max(drone.hitPoints, 0) + '/' + drone.maxHitPoints + ')';
            } else {
                rollStr += ' miss';
            }
            rollStr += '</div>';
            $('#dataDiv').append(rollStr);

            if (drone.hitPoints <= 0) {
                $('#dataDiv').append('<div>Drone #' + drone.id + ' destroyed</div>');
                removeActiveDrone(drone);
                selTargetDroneId = -1;
                clearTargetHexHighlight();
                $('#targetShipPopUpDiv').css('display', 'none');
            }

            shipFirePopUp();
        }

        // fires an ADD (Anti-Drone Device) rack, OR Drone-G firing in its
        // hybrid ADD mode. Unlike every other weapon:
        // - ammo is a flat charge count, not ship power - for a dedicated
        //   ADD rack that's chargesCurrent; for Drone-G it's the
        //   "ADD-Charge" entry in its shared drone loadout instead (see
        //   DRONE_G_WEAPON_TYPE_ID)
        // - no cooldown at all (see weaponReady()'s early-exit for ADD, and
        //   its addFiredThisTurn cross-check for Drone-G)
        // - can ONLY target drones or sizeClass-6 ships (shuttles/fighters) -
        //   the UI gating in shipFirePopUp() already restricts selection to
        //   these, so this function trusts the target it's given
        // - a hit on a drone is an instant kill regardless of its HP
        // - a hit on a sizeClass-6 ship rolls a separate 1d6 for 1-6 damage,
        //   applied through the normal shield/damageList pipeline
        // NOTE: no ship in the current scenario is sizeClass 6, so the
        // ship-targeting branch below is implemented but currently
        // unreachable/untested in practice - only the drone-targeting path
        // can actually be exercised right now.
        function fireADD(sArrId, wArrId, targetType, targetId, arc) {
            var launcher = shipList[sArrId];
            var wEntry = launcher.shipWeapons[wArrId];
            var isDroneG = (wEntry.weaponTypeId == DRONE_G_WEAPON_TYPE_ID);

            // Drone-G's catalog entry ("Drone G") has no damage table of its
            // own - when firing in ADD mode it uses ADD-6's to-hit table,
            // since no distinct table was specified for the hybrid case
            var weapon = null;
            for (var y = 0; y < weaponList.length; y++) {
                if (weaponList[y].weaponTypeId == wEntry.weaponTypeId && !isDroneG) { weapon = weaponList[y]; }
                if (isDroneG && weaponList[y].weaponName == 'ADD-6') { weapon = weaponList[y]; }
            }
            if (!weapon) { shipFirePopUp(); return; }

            var ammoAvailable = isDroneG ? (wEntry.droneLoadout['ADD-Charge'] || 0) : wEntry.chargesCurrent;
            if (ammoAvailable <= 0) { shipFirePopUp(); return; }

            // NOTE: bFired intentionally NOT set here - ADD has no
            // once-per-turn or recycle limit (see weaponReady())
            wEntry.lastFiredAbsImpulse = currentAbsoluteImpulse();
            wEntry.impFired = impulse;
            if (isDroneG) {
                wEntry.droneLoadout['ADD-Charge'] -= 1;
            } else {
                wEntry.chargesCurrent -= 1;
            }
            wEntry.addFiredThisTurn = true; // tracked for endTurn()'s didn't-fire-last-turn reload bonus, and for Drone-G's cross-mode exclusivity in weaponReady()

            var range = (targetType == 'drone') ? findDistToDrone(launcher.userId, targetId) : findDist(launcher.userId, targetId);
            var r = rollD6();
            var hits = null;
            try { hits = getDamage(weapon, range); } catch (e) { hits = null; }
            var isHit = hits && (r <= hits[0]);

            var displayName = isDroneG ? 'Drone G (ADD mode)' : weapon.weaponName;
            var remainingAmmo = isDroneG ? (wEntry.droneLoadout['ADD-Charge'] || 0) : wEntry.chargesCurrent;
            var ammoNote = isDroneG ? (remainingAmmo + ' charges left') : (remainingAmmo + '/' + wEntry.chargesMax + ' charges left');
            var rollStr = '<div>' + launcher.name + ' - ' + displayName + ' roll ' + r + ' (' + ammoNote + ')';

            if (targetType == 'drone') {
                var drone = null;
                for (var i = 0; i < activeDrones.length; i++) { if (activeDrones[i].id == targetId) { drone = activeDrones[i]; } }
                if (!drone || drone.bDestroyed) { shipFirePopUp(); return; }

                if (isHit) {
                    rollStr += ' -- HIT, drone destroyed</div>';
                    $('#dataDiv').append(rollStr);
                    removeActiveDrone(drone);
                    if (selTargetDroneId == targetId) {
                        selTargetDroneId = -1;
                        clearTargetHexHighlight();
                        $('#targetShipPopUpDiv').css('display', 'none');
                    }
                } else {
                    rollStr += ' miss</div>';
                    $('#dataDiv').append(rollStr);
                }
            } else {
                var targetArrId = -1;
                for (var z = 0; z < shipList.length; z++) { if (shipList[z].userId == targetId) { targetArrId = z; } }
                if (targetArrId == -1) { shipFirePopUp(); return; }

                if (isHit) {
                    var dmg = rollD6();
                    var shieldFacingBearing = findFacing(targetId, launcher.userId);
                    var shieldNum = shieldFacing(shieldFacingBearing);
                    rollStr += ' -- ' + dmg + ' damage to shield #' + shieldNum + '</div>';
                    $('#dataDiv').append(rollStr);

                    var bAdded = false;
                    for (var z = 0; z < damageList.length; z++) {
                        if (damageList[z].targetId == targetId && damageList[z].shield == shieldNum) {
                            damageList[z].damage += dmg;
                            bAdded = true;
                        }
                    }
                    if (!bAdded) damageList[damageList.length] = new damageListType(targetId, shieldNum, dmg);
                } else {
                    rollStr += ' miss</div>';
                    $('#dataDiv').append(rollStr);
                }
            }

            shipFirePopUp();
        }

        function doneFire() {
            $('#fireShipPopUpDiv').css('display', 'none');
            $('.weaponArc').remove();
            fireShipList.shift();
            fireShips();
        }

        function applyDamage() {
            var arrId = -1;
            var shield = 0;
            var s = 0;
            var d = 0;
            //for (var x = 0; x < damageList.length; x++) {
            if (damageList.length > 0) {
                s = 0;
                d = damageList[0].damage;
                shield = damageList[0].shield;
                for (var z = 0; z < shipInternals.length; z++) {
                    if (shipInternals[z].userId == damageList[0].targetId) { arrId = z; }
                }

                var targetName = '';
                var targetArrId = -1;
                for (var zz = 0; zz < shipList.length; zz++) {
                    if (shipList[zz].userId == damageList[0].targetId) { targetName = shipList[zz].name; targetArrId = zz; }
                }

                // shuttles have no shields/armor/DAC at all - full incoming
                // damage applies straight to flat HP, same idea as a drone
                if (targetArrId != -1 && shipList[targetArrId].isShuttle) {
                    var shuttle = shipList[targetArrId];
                    shuttle.hitPoints -= d;
                    $('#dataDiv').append('<div>' + targetName + ' takes ' + d + ' damage (HP ' + Math.max(shuttle.hitPoints, 0) + '/' + shuttle.maxHitPoints + ')</div>');
                    if (shuttle.hitPoints <= 0) {
                        $('#dataDiv').append('<div>' + targetName + ' destroyed</div>');
                        removeShipEntirely(shuttle.userId);
                    }
                    damageList.shift();
                    damageShips();
                    return;
                }

                // 1) general reinforcement absorbs first - any facing
                if (d > 0 && shipInternals[arrId].generalReinforcement > 0) {
                    var usedGeneral = Math.min(d, shipInternals[arrId].generalReinforcement);
                    shipInternals[arrId].generalReinforcement -= usedGeneral;
                    d -= usedGeneral;
                    $('#dataDiv').append('<div>' + targetName + ' general reinforcement absorbs ' + usedGeneral + ' (' + shipInternals[arrId].generalReinforcement + ' left)</div>');
                }

                // 2) specific reinforcement for this facing absorbs next
                if (d > 0) {
                    var specificField = 'specificShield' + shield;
                    if (shipInternals[arrId][specificField] > 0) {
                        var usedSpecific = Math.min(d, shipInternals[arrId][specificField]);
                        shipInternals[arrId][specificField] -= usedSpecific;
                        d -= usedSpecific;
                        $('#dataDiv').append('<div>' + targetName + ' shield #' + shield + ' specific reinforcement absorbs ' + usedSpecific + ' (' + shipInternals[arrId][specificField] + ' left)</div>');
                    }
                }

                // 3) the shield's own value absorbs next
                eval('s = shipInternals[arrId].shield' + shield);
                $('#dataDiv').append('<div>' + targetName + ' shield #' + shield + ' absorbs up to ' + s + ' (incoming ' + d + ')</div>');

                if (d <= 0) {
                    // fully absorbed by reinforcement, shield untouched
                }
                else if (s >= d) {
                    s = s - d;
                    eval('shipInternals[arrId].shield' + shield + ' = ' + s);
                }
                else {
                    d = d - s;
                    eval('shipInternals[arrId].shield' + shield + ' = 0');
                    // 4) armor
                    if (shipInternals[arrId].armor >= d) {
                        shipInternals[arrId].armor = shipInternals[arrId].armor - d;
                        d = 0;
                    }
                    else {
                        d = d - shipInternals[arrId].armor;
                        shipInternals[arrId].armor = 0;
                    }

                    $('#dataDiv').append('<div>' + targetName + ' shield #' + shield + ' overloaded - ' + d + ' damage carries through</div>');

                    // 5) internal damage
                    if (d > 0) {
                        damageShip(damageList[0].targetId, damageList[0].shield, d);
                        // alert(damageList[x].targetId + ' ' + damageList[x].arc + ' ' + d)
                    }
                }
                damageList.shift();

        function damageShip(sId, shield, d) {
            var arrId = -1;
            var r = 0;
            for (var z = 0; z < shipInternals.length; z++) {
                if (shipInternals[z].userId == sId) { arrId = z; }
            }

            resetVolleyFlags();

            var bDamage = false;
            var str = '';
            var x = 0;
            var s = 0;
            var hitSystems = [];

                if (shipList[zz].userId == sId) { targetName = shipList[zz].name; }
            }
            $('#dataDiv').append('<div>' + targetName + ' takes ' + d + ' internal hit' + ((d == 1) ? '' : 's') + ' (excess past shield #' + shield + ')</div>');

            for (var z = 0; z < d; z++) {
                r = roll2D6();
                x = 0;
                bDamage = false;
                while (!bDamage) {
                    if (dacChart[r][x].bOneTime && dacChart[r][x].bVolley) {
                        x++;
                    }
                    else {
                        dacChart[r][x].bVolley = true;
                        str = dacChart[r][x].name;

                                if (shipInternals[arrId].sensor[y][1] == 1) {
                                    shipInternals[arrId].sensor[y][1] = 0;
                                    bDamage = true;
                                    break;
                                }
                            }
                        }
                        else if (str == 'scanner') {
                            for (var y = 0; y < shipInternals[arrId].scanner.length; y++) {
                                if (shipInternals[arrId].scanner[y][1] == 1) {
                                    shipInternals[arrId].scanner[y][1] = 0;
                                    bDamage = true;
                                    break;
                                }
                            }
                        }
                        else if (str == 'damageCon') {
                            for (var y = 0; y < shipInternals[arrId].damageCon.length; y++) {
                                if (shipInternals[arrId].damageCon[y][1] == 1) {
                                    shipInternals[arrId].damageCon[y][1] = 0;
                                    bDamage = true;
                                    break;
                                }
                            }
                        }
                        else if (str == 'drone') {
                            bDamage = damageWeapon(sId, 4, -1);
                        }
                        else if (str == 'torp') {
                            bDamage = damageWeapon(sId, 2, -1);
                            // or
                            //bDamage = damageWeapon(sId, 3, -1);
                        }
                        else if (str == 'phaser') {
                            bDamage = damageWeapon(sId, 1, shield);
                        }
                        else if (str == 'weapon') {
                            bDamage = damageWeapon(sId, 0, -1);
                        }
                        else {
                            eval('s = shipInternals[arrId].' + str);
                            if (s > 0) {

                                bDamage = true;
                                eval('shipInternals[arrId].' + str + ' = ' + s);
                            }

                                    if (shipInternals[arrId].hull > 0) {

                                        shipInternals[arrId].hull--;
                                    }
                                }
                            }

                            //function shipSystemsType(userId, flag, bridge, aux, emer, scrty, armor, fHull, aHull, hull, lab, probe, trac, tran, shut, rWarp, lWarp, cWarp, imp, apr, bty, shield1, shield2, shield3, shield4, shield5, shield6, excess) {

        function damageWeapon(sId, wClass, shield) {
            var bDamage = false;
            var arrId = -1;
            for (var z = 0; z < shipList.length; z++) {
                if (shipList[z].userId == sId) { arrId = z; }
            }

            //var str = '<div>sId=' + sId + ' wC=' + wClass + ' s=' + shield + ' arrId=' + arrId + ' ' + shipList[arrId].shipWeapons.length + '</div>';
            //str += '<div>' + shipList[arrId].shipWeapons[0].startP + ' ' + shipList[arrId].shipWeapons[0].arc + '</div>';
            //str += '<div>' + weaponInArc(shipList[arrId].shipWeapons[0], 0) + '</div>';
            //$('#dataDiv').append(str);

            var arc = 0;
            if (shield == 2) arc = 60;
            if (shield == 3) arc = 120;
            if (shield == 4) arc = 180;
            if (shield == 5) arc = 240;
            if (shield == 6) arc = 300;

            // collect every eligible mount (right type, in arc, not already
            // destroyed) - last-to-first, same order the old single-pick
            // loop used, so tie-breaking within a priority tier is unchanged
            var candidates = [];
            for (var x = (shipList[arrId].shipWeapons.length - 1); x >= 0; x--) {
                var wEntry = shipList[arrId].shipWeapons[x];
                if (!wEntry.bDestroyed) {
                    if (wEntry.weaponClassId == wClass || wClass == 0) {  // right type of weapon
                        if (weaponInArc(wEntry, arc) || arc == -1) {  // in arc
                            candidates.push(wEntry);
                        }
                    }
                }
            }

            // preferred hit order: already-fired (charge already spent) >
            // never charged (idle) > currently armed/holding a charge -
            // strip the least valuable state off the ship before touching
            // a live loaded weapon
            var target = null;
            for (var i = 0; i < candidates.length; i++) { if (candidates[i].bFired) { target = candidates[i]; break; } }
            if (!target) { for (var i = 0; i < candidates.length; i++) { if (!candidates[i].bArmed) { target = candidates[i]; break; } } }
            if (!target && candidates.length > 0) { target = candidates[0]; }

            if (target) {
                target.bDestroyed = true;
                bDamage = true;
            }

            return bDamage;
        }



        // the ship's damage control budget for a turn is the single
        // HIGHEST-value intact damage control box, not the sum of all of
        // them - only one damage control party works per turn, so a ship
        // with boxes [4,4,2,2,2,0] can allocate up to 4 points in a turn,
        // not 14 (and once that box is knocked out, the next-highest
        // intact one becomes the cap).
        function getDamageConMax(internals) {
            var maxVal = 0;
            for (var z = 0; z < internals.damageCon.length; z++) {
                if (internals.damageCon[z][1] == 1 && internals.damageCon[z][0] > maxVal) {
                    maxVal = internals.damageCon[z][0];
                }
            }
            return maxVal;
        }

        // basic functions
        function findDist(sId1, sId2) {
            var x1, x2, y1, y2;
            for (var z = 0; z < shipList.length; z++) {
                if (shipList[z].userId == sId1) { x1 = shipList[z].xCord; y1 = shipList[z].yCord; }
                if (shipList[z].userId == sId2) { x2 = shipList[z].xCord; y2 = shipList[z].yCord; }
            }
            var d = 0;
            var dx = Math.abs(x1 - x2);
            var dy = Math.abs(y1 - y2);
            d = dx;
            var a = dy - Math.floor(dx / 2);
            if (((x1 % 2) == 0) && ((x2 % 2) == 1) && (y1 < y2)) a--;
            if (((x1 % 2) == 1) && ((x2 % 2) == 0) && (y1 > y2)) a--;
            if (a > 0) d += a;
            //$('#dataDiv').append('<div>x1=' + x1 + ' y1=' + y1 + ' x2=' + x2 + ' y2=' + y2 + ' dx=' + dx + ' dy=' + dy + ' a=' + a + ' d=' + d + '</div>')
            return d;
        }

        // --- weapon recycle time: fixed 8-impulse cooldown between shots,
        // separate from and independent of each weapon's fireRate value.
        // Applies to every weapon class including seeking weapons (drones)
        // and disruptors. The one exception is Phaser-G (weaponTypeId 4):
        // it's tracked as a single hit-location/mount, but operationally
        // behaves like 4 independent Phaser-3s, so it doesn't share their
        // recycle restriction.
        var PHASER_G_WEAPON_TYPE_ID = 4;
        var WEAPON_RECYCLE_IMPULSES = 8;
        var IMPULSES_PER_TURN = 32;
        // ADD (Anti-Drone Device) racks: weaponClassId 5. Phaser-like direct
        // fire, but ammo is a flat charge count instead of phaser power, and
        // (see weaponReady()) they're fully exempt from both the once-per-turn
        // and 8-impulse recycle restrictions above - they can fire every impulse.
        var ADD_WEAPON_CLASS_ID = 5;
        // Drone-G (weaponTypeId 36) is a hybrid mount: its loadout can hold
        // a mix of real drone types AND "ADD-Charge" (a pseudo drone-type,
        // see drone-types.json) in the same shared magazine. Picking a real
        // type at fire time launches a drone as normal; picking ADD-Charge
        // fires it like an ADD instead (see fireADD() and weaponReady()).
        // The two modes are mutually exclusive within a turn - see the
        // addFiredThisTurn cross-check in weaponReady().
        var DRONE_G_WEAPON_TYPE_ID = 36;

        // --- energy allocation ---
        // once per turn, before movement begins. Modeled on the actual SFB
        // Energy Allocation Form:
        //   lines 1-3  warp/impulse/reactor generate fresh power each turn
        //   lines 5-6  battery is a PERSISTENT reservoir (doesn't reset -
        //              you choose how much stored charge to discharge this
        //              turn, and separately how much to recharge it by)
        //   line 7-8   life support + active fire control: fixed cost, 1
        //              each for now, paid automatically off the top
        //   line 9     phaser capacitor is ALSO persistent - unused charge
        //              carries forward turn to turn, capped at maxPhaserCap
        //   line 10    heavy weapons (disruptors/photon/plasma - NOT
        //              phasers, NOT drones) need 2 power to arm, and once
        //              armed stay armed across turns until fired
        //   line 11    shields: flat 2 power to stay active at all; paying
        //              0 drops all 6 shields to 0 immediately
        //   line 14    movement: 1 power/speed point, funded only by warp
        //              (any amount) + impulse (capped at 1 point) - same
        //              restriction as before
        //   line 16    battery recharge: spend generated power this turn to
        //              refill the battery reservoir for future turns
        // Lines 12-13 (reinforcement), 15 (damage control), 17 (tractor),
        // 18 (transporters), 19 (ECM/ECCM/labs/wild weasel/cloaking) are
        // explicitly out of scope for now.
        var energyAllocList = [];
        var HEAVY_WEAPON_ARM_COST = 2;
        var SHIELD_ACTIVATION_COST = 2;
        var GENERAL_REINFORCEMENT_COST = 2; // power per point, absorbs a hit from any facing
        var SPECIFIC_REINFORCEMENT_COST = 1; // power per point, only absorbs hits to its own facing
        var LIFE_SUPPORT_COST = 1;
        var FIRE_CONTROL_COST = 1;

        function startEnergyAllocation() {
            energyAllocList = [];
            for (var x = 0; x < shipList.length; x++) {
                // shuttles skip energy allocation entirely - their speed is
                // fixed at SHUTTLE_SPEED from the moment they launch, and
                // they have no power systems to manage. They still get a
                // normal move-phase turning popup like any ship, via
                // moveShips()/shipMovePopUp(), which don't touch this list.
                if (shipList[x].isShuttle) continue;
                energyAllocList.push(shipList[x].userId);
            }
            setPhase('Energy Allocation');
            allocateNextShip();
        }

        function allocateNextShip() {
            if (energyAllocList.length == 0) {
                writeImpulseChart(); // refresh with this turn's newly-allocated speeds before movement starts
                oneImpluse();
                return;
            }
            showEnergyAllocPopUp(energyAllocList[0]);
        }

        // true if two ship/shuttle userIds belong to the same team - used
        // to block targeting your own ships, shuttles, or drones
        function isSameTeam(userIdA, userIdB) {
            var teamA = null, teamB = null;
            for (var z = 0; z < shipList.length; z++) {
                if (shipList[z].userId == userIdA) teamA = shipList[z].team;
                if (shipList[z].userId == userIdB) teamB = shipList[z].team;
            }
            return teamA != null && teamA === teamB;
        }

        // faint background colors for the move/fire/energy-allocation
        // popups, so it's visually obvious which team's ship you're
        // currently looking at. Assigned in first-seen order (team 1 =
        // whichever team appears first, gets blue; team 2 gets red; a 3rd
        // or 4th team later would just extend down the list).
        var TEAM_COLORS = ['#eaf2ff', '#ffecec', '#eaffea', '#fff6d9'];
        var teamColorAssignments = {};
        function getTeamBgColor(sId) {
            var team = null;
            for (var z = 0; z < shipList.length; z++) {
                if (shipList[z].userId == sId) { team = shipList[z].team; }
            }
            if (team == null) return '#fff';
            if (!(team in teamColorAssignments)) {
                teamColorAssignments[team] = TEAM_COLORS[Object.keys(teamColorAssignments).length % TEAM_COLORS.length];
            }
            return teamColorAssignments[team];
        }

        function findShipArrId(sId) {
            for (var z = 0; z < shipList.length; z++) {
                if (shipList[z].userId == sId) return z;
            }
            return -1;
        }
        function findInternalsArrId(sId) {
            for (var z = 0; z < shipInternals.length; z++) {
                if (shipInternals[z].userId == sId) return z;
            }
            return -1;
        }

        function addShieldPoints(iArrId, shieldNum, gain) {
            if (gain == 0) return;
            if (shieldNum == 1) shipInternals[iArrId].shield1 += gain;
            else if (shieldNum == 2) shipInternals[iArrId].shield2 += gain;
            else if (shieldNum == 3) shipInternals[iArrId].shield3 += gain;
            else if (shieldNum == 4) shipInternals[iArrId].shield4 += gain;
            else if (shieldNum == 5) shipInternals[iArrId].shield5 += gain;
            else if (shieldNum == 6) shipInternals[iArrId].shield6 += gain;
        }

        // drops all 6 shields to 0, but only snapshots their current values
        // the first time (if already dropped, don't overwrite the saved
        // snapshot with zeros)
        function dropShields(iArrId) {
            var internals = shipInternals[iArrId];
            if (internals.shieldsActive) {
                internals.savedShield1 = internals.shield1;
                internals.savedShield2 = internals.shield2;
                internals.savedShield3 = internals.shield3;
                internals.savedShield4 = internals.shield4;
                internals.savedShield5 = internals.shield5;
                internals.savedShield6 = internals.shield6;
                internals.shield1 = 0;
                internals.shield2 = 0;
                internals.shield3 = 0;
                internals.shield4 = 0;
                internals.shield5 = 0;
                internals.shield6 = 0;
            }
            internals.shieldsActive = false;
        }

        // restores shields to whatever they were right before they were
        // dropped (reflecting damage taken before the drop, not a reset to
        // full strength). No-op if shields were already active.
        function restoreShields(iArrId) {
            var internals = shipInternals[iArrId];
            if (!internals.shieldsActive) {
                internals.shield1 = internals.savedShield1;
                internals.shield2 = internals.savedShield2;
                internals.shield3 = internals.savedShield3;
                internals.shield4 = internals.savedShield4;
                internals.shield5 = internals.savedShield5;
                internals.shield6 = internals.savedShield6;
            }
            internals.shieldsActive = true;
        }

        // heavy weapons = disruptors/photon (weaponClassId 2) and plasma
        // (weaponClassId 3) - NOT phasers (1, funded via phaser capacitor
        // instead) and NOT drones (4, not modeled as needing arming here)
        function isHeavyWeaponClass(wClass) {
            return wClass == 2 || wClass == 3;
        }

        // weaponTypeIds 10/11/12 = Disruptor/UIM/DERFACS. Photon (13) and
        // Plasma (20-23) also share weaponClassId 2/3 but aren't disruptors -
        // their overload mechanics are different (and photon's isn't built
        // yet), so this distinguishes which "heavy weapon" sub-rules apply.
        var DISRUPTOR_WEAPON_TYPE_IDS = [10, 11, 12];
        function isDisruptorWeaponTypeId(weaponTypeId) {
            return DISRUPTOR_WEAPON_TYPE_IDS.includes(weaponTypeId);
        }
        var DISRUPTOR_OVERLOAD_MAX_RANGE = 8;
        var DISRUPTOR_OVERLOAD_FEEDBACK_DAMAGE = 2;

        // photon: loaded over 2 rounds using warp power specifically, min
        // 2/max 6 per round, max 8 total. 4 total = normal (8 dmg, matches
        // existing data exactly since 4*2=8); 5-8 = overload, damage =
        // investedPower*2, same hit-chance chart but capped at range 8, and
        // can fire at ranges 0/1 (blocked for normal) with feedback damage
        // = investedPower - 4, only when fired at those newly-unlocked
        // ranges (0/1), same shield-facing convention as disruptor feedback.
        var PHOTON_WEAPON_TYPE_ID = 13;
        var PHOTON_ROUND_MIN = 2;
        var PHOTON_ROUND_MAX = 6;
        var PHOTON_TOTAL_MAX = 8;
        var PHOTON_NORMAL_TOTAL = 4;
        var PHOTON_MAINTENANCE_COST = 1; // holding a normal-load photon
        var PHOTON_MAINTENANCE_COST_OVERLOAD = 2; // holding an overloaded photon - every turn it's held, not just the first
        var PHOTON_OVERLOAD_MAX_RANGE = 8;
        function isPhotonWeaponTypeId(weaponTypeId) {
            return weaponTypeId == PHOTON_WEAPON_TYPE_ID;
        }
        function getPhotonMaintenanceCost(wEntry) {
            return (wEntry.loadType == 'overload') ? PHOTON_MAINTENANCE_COST_OVERLOAD : PHOTON_MAINTENANCE_COST;
        }

        function showEnergyAllocPopUp(sId) {
            $('#energyAllocPopUpDiv').css('background-color', getTeamBgColor(sId));
            var arrId = findShipArrId(sId);
            var ship = shipList[arrId];

            var iArrId = findInternalsArrId(sId);
            var internals = shipInternals[iArrId];

            var warpAvail = internals.rWarp + internals.lWarp + internals.cWarp;
            var impAvail = internals.imp;
            var aprAvail = internals.apr;
            var generated = warpAvail + impAvail + aprAvail;
            var maxSpeed = warpAvail + Math.min(1, impAvail);

            var batteryMax = internals.mBty;
            var batteryStored = internals.batteryStored;
            var batteryHeadroom = batteryMax - batteryStored;

            var phaserCapMax = ship.maxPhaserCap;
            var phaserCapCurrent = ship.phaserCap;

            var str = '<div style="font-weight:bold;">Energy Allocation: ' + ship.name + ' id=' + sId + '</div>';
            str += '<div style="color:#666;padding-bottom:6px;">Generated: Warp ' + warpAvail + ' &middot; Impulse ' + impAvail + ' &middot; Reactor ' + aprAvail + ' = ' + generated + '</div>';
            str += '<div class="dividerLine"></div>';

            str += '<div>Battery: ' + batteryStored + ' / ' + batteryMax + ' stored</div>';
            str += '<div style="float:left;">Discharge this turn (adds to available power):</div>';
            str += '<div style="float:right;"><input type="number" id="eaBattDischarge" min="0" max="' + batteryStored + '" value="0" style="width:35px;text-align:center;" oninput="updateEnergyAllocTotal();"></div>';
            str += '<div style="clear:both;"></div>';

            str += '<div class="dividerLine"></div>';
            str += '<div style="float:left;">Life Support: ' + LIFE_SUPPORT_COST + '</div>';
            str += '<div style="float:left;padding-left:20px;">Active Fire Control: ' + FIRE_CONTROL_COST + '</div>';
            str += '<div style="float:right;width:35px;text-align:center;">' + (LIFE_SUPPORT_COST + FIRE_CONTROL_COST) + '</div>';
            str += '<div style="clear:both;"></div>';

            var shieldsCurrentlyActive = internals.shieldsActive;
            str += '<div style="float:left;"><input type="checkbox" id="eaShieldsActive"' + (shieldsCurrentlyActive ? ' checked' : '') + ' onclick="updateEnergyAllocTotal();"> Active shields(' + SHIELD_ACTIVATION_COST + ') - unchecking drops shields</div>';
            str += '<div id="displayShieldCost" style="float:right;width:35px;text-align:center;">' + (shieldsCurrentlyActive ? SHIELD_ACTIVATION_COST : 0) + '</div>';
            str += '<div style="clear:both;"></div>';
            if (!shieldsCurrentlyActive) { str += '<div style="color:#900;font-size:11px;">Shields currently DOWN - re-checking will restore ' + internals.savedShield1 + '/' + internals.savedShield2 + '/' + internals.savedShield3 + '/' + internals.savedShield4 + '/' + internals.savedShield5 + '/' + internals.savedShield6 + '</div>'; }

            str += '<div class="dividerLine"></div>';
            str += '<div style="float:left;">General Reinforcement (' + GENERAL_REINFORCEMENT_COST + 'pt/pt):</div>';
            str += '<div style="float:right;"><span id="eaGeneralReinforcePts" style="color:#666;">(+0 pts)</span> <input type="number" id="eaGeneralReinforce" min="0" value="0" style="width:35px;text-align:center;" oninput="updateEnergyAllocTotal();"></div>';
            str += '<div style="clear:both;"></div>';

            var damageConTotal = getDamageConMax(internals);
            str += '<div>Damage Control (<span id="eaDamageConRemaining">' + damageConTotal + '</span>/' + damageConTotal + ' pts available, 2pt repairs 1pt of shield, applied end of round):</div>';
            str += '<div>Specific Reinforcement (1pt/pt):</div>';
            for (var s = 1; s <= 6; s++) {
                var curShieldVal = internals['shield' + s];
                var maxShieldVal = internals['mShield' + s];
                str += '<div style="float:left;">Shield #' + s + ' (' + curShieldVal + '):</div>';
                if (curShieldVal < maxShieldVal) {
                    str += '<div style="float:right;"><input type="number" id="eaSpecificReinforce' + s + '" min="0" value="0" style="width:35px;text-align:center;" oninput="updateEnergyAllocTotal();"></div>';
                    str += '<div style="float:right;margin-right:4px;"><input type="number" id="eaDamageControl' + s + '" min="0" value="0" style="width:35px;text-align:center;" oninput="updateEnergyAllocTotal();"></div>';
                } else if (curShieldVal > 0) {
                    str += '<div style="float:right;"><input type="number" id="eaSpecificReinforce' + s + '" min="0" value="0" style="width:35px;text-align:center;" oninput="updateEnergyAllocTotal();"></div>';
                    str += '<div style="float:right;margin-right:4px;color:#999;line-height:21px;">n/a</div>';
                } else {
                    str += '<div style="float:right;color:#999;line-height:21px;">n/a</div>';
                    str += '<div style="float:right;margin-right:4px;color:#999;line-height:21px;">n/a</div>';
                }
                str += '<div style="clear:both;"></div>';
            }

            str += '<div class="dividerLine"></div>';
            str += '<div style="float:left;">Phaser Capacitor: ' + phaserCapCurrent + ' / ' + phaserCapMax + ' - add this turn:</div>';
            str += '<div style="float:right;"><input type="number" id="eaPhaserAdd" min="0" max="' + phaserCapHeadroom + '" value="0" style="width:35px;text-align:center;" oninput="updateEnergyAllocTotal();"></div>';
            str += '<div style="clear:both;"></div>';

            str += '<div class="dividerLine"></div>';
            str += '<div>Heavy Weapons (' + HEAVY_WEAPON_ARM_COST + ' normal / ' + (HEAVY_WEAPON_ARM_COST * 2) + ' overload to arm):</div>';
            for (var z = 0; z < ship.shipWeapons.length; z++) {
