        function shipType(userId, name, xCord, yCord, facing, turnMode, speed, phaserCap, sizeClass) {
            this.userId = userId;
            this.name = name;
            this.xCord = xCord;
            this.yCord = yCord;
            this.facing = facing;  // 0-360
            this.turnMode = turnMode;
            this.turnMarker = 10;
            this.speed = speed;
            this.sideSlip = true;
            this.phaserCap = phaserCap;
            this.maxPhaserCap = phaserCap; // starting value, restored each turn in endTurn()
            this.sizeClass = sizeClass; // 1 (biggest) - 7 (smallest)
            this.shipWeapons = [];
            // team: defaults to the ship's own userId (so today, with one
            // ship per side, "same team" and "same ship" are equivalent).
            // Shuttles inherit their mothership's team in launchShuttle().
            // Lets targeting checks generalize to "multiple ships on one
            // side" later without changing how they're written.
            this.team = userId;

            // shuttles: isShuttle marks a launched shuttle itself (flat
            // HP, no shields/DAC - see applyDamage()'s bypass for that,
            // and no energy allocation - see showEnergyAllocPopUp()'s
            // bypass for that). ownerShipId is only meaningful on a
            // shuttle, pointing back to its mothership for docking.
            // shuttleHangar/Max are only meaningful on a mothership - a
            // simple depleting/refillable count, no per-shuttle-type
            // magazine complexity like drone racks have.
            this.isShuttle = false;
            this.ownerShipId = null;
            this.hitPoints = 0;
            this.maxHitPoints = 0;
            this.shuttleHangar = 0;
            this.shuttleHangarMax = 0;
            // how many shuttle launches (and, separately, how many
            // landings) this ship can do per impulse - 1 for everyone for
            // now; some ships will eventually be special-cased higher
            this.shuttleOpsPerImpulse = 1;
            // drone ammo: a single shared magazine for the whole ship, not
            // per-rack. Capacity is the sum of every mounted drone rack's
            // capacity (weaponList[...].powerCost, repurposed as magazine
            // size for weaponClassId 4 - drones themselves cost no power).
            // Populated by setupDroneLoadouts() once weaponList is loaded,
            // since it isn't known yet at ship-construction time here.
            // drone stockpile: reserve drones held in ship-wide storage,
            // used to reload racks. Keyed by drone type name ("Type-I" etc)
            // since a rack can hold - and a stockpile can carry - a mix of
            // types, not a single homogeneous count. Populated by
            // setupDroneLoadouts() once weaponList/droneTypeList are
            // loaded, mirroring the sum of every rack's initial loadout.
            this.droneStockpile = {}; // { "Type-I": 4, "Type-IV": 2, ... }
            this.droneStockpileSpaceMax = 0; // fixed total space capacity (sum of all racks' capacities)
            // ADD reload stockpile: unlike drones, ADD ammo isn't typed, so
            // this is just a plain count - sized to 2x the combined charge
            // capacity of all ADD racks on the ship ("two sets of reloads").
            // Populated by setupADDCharges() once weaponList is loaded.
            this.addStockpile = 0;
        }

        // Weapon damage tables now live in data/weapons.json and are loaded
        // into `weaponList` by loadWeapons() (see js/weapons.js), called

        function damageListType(targetId, shield, damage) {
            this.targetId = targetId;
            this.shield = shield;
            this.damage = damage;
        }



        function weaponEntryType(shipWeaponId, weaponTypeId, weaponClassId, startP, arc, startP2, arc2, extraArcs) {
            this.shipWeaponId = shipWeaponId;
            this.weaponTypeId = weaponTypeId;
            this.weaponClassId = weaponClassId;
            this.startP = startP;
            this.arc = arc;
            this.startP2 = startP2;
            this.arc2 = arc2;
            // extraArcs: optional array of {start, arc} segments for weapons whose
            // firing coverage is more than two contiguous ranges (e.g. a wing
            // phaser with disjoint bonus/excluded hexes per its SSD diagram).
            // Each segment is checked the same way as the primary/secondary arc.
            this.extraArcs = extraArcs || [];
            this.bFired = false;
            this.impFired = 0;
            this.lastFiredAbsImpulse = null; // absolute (cross-turn) impulse count when last fired - drives the 8-impulse recycle rule
            this.bDestroyed = false;
            this.bArmed = false; // heavy weapons (disruptors/photon/plasma) need 2 power to arm via energy allocation; stays armed across turns until fired
            this.loadType = null; // null | 'normal' | 'overload'
            // photon-specific multi-round loading state (disruptors use bArmed/loadType directly instead)
            this.loadRounds = 0; // 0/1/2 - rounds of loading power invested so far
            this.investedPower = 0; // cumulative warp power invested during loading (4 = normal, 5-8 = overload)
            this.armedTurnNumber = null; // turn number it became fully armed (loadRounds hit 2) - used for the maintenance grace period
            // drone racks (weaponClassId 4) only: this rack's own loaded
            // magazine, separate from the ship-wide reload stockpile. Capped
            // at the rack type's own capacity (weaponList[...].powerCost,
            // repurposed for drones). Populated by setupDroneLoadouts()
            // once weaponList is loaded.
            // drone racks (weaponClassId 4) only: a rack has a fixed number
            // of SPACES (droneRackSpaceCapacity), which can be filled with
            // any mix of drone types - a 4-space rack might hold 4 Type-I,
            // 2 Type-IV, or a combination. droneLoadout tracks what's
            // actually in the rack right now, keyed by type name.
            // droneInitialLoadout is a snapshot of what the rack started
            // the scenario with, and reload restores toward it. Populated
            // by setupDroneLoadouts() once weaponList/droneTypeList are
            // loaded.
            this.droneRackSpaceCapacity = 0;
            this.droneLoadout = {}; // { "Type-I": 2, "Type-IV": 1, ... }
            this.droneInitialLoadout = {};
            this.bReloading = false; // set true for the turn a rack is disabled to reload from the ship's stockpile
            // ADD racks (weaponClassId 5) only: a flat charge count instead
            // of power or a drone magazine - no types, no space-weighting,
            // just decrementing by 1 per shot. Populated by
            // setupADDCharges() once weaponList is loaded.
            this.chargesMax = 0;
            this.chargesCurrent = 0;
            this.addFiredThisTurn = false; // ADD only: tracked separately from bFired (which ADD never sets) so endTurn() can grant the didn't-fire-last-turn reload bonus
        }

            this.mImp = imp;
            this.mApr = apr;
            this.mBty = bty;
            this.mShield1 = shield1;
            this.mShield2 = shield2;
            this.mShield3 = shield3;
            this.mShield4 = shield4;
            this.mShield5 = shield5;
            this.mShield6 = shield6;
            this.mExcess = excess;
            this.sensor = [];
            this.scanner = [];
            this.damageCon = [];
            this.batteryStored = bty; // persistent charge reservoir - starts full, carries over between turns via energy allocation

            // shield activation memory: when shields are dropped (0 power
            // paid for line 11), current values are snapshotted here so
            // reactivating later restores them (reflecting any damage they
            // already had), rather than resetting to 0 forever or jumping
            // back to full strength
            this.shieldsActive = true;
            this.savedShield1 = shield1;
            this.savedShield2 = shield2;
            this.savedShield3 = shield3;
            this.savedShield4 = shield4;
            this.savedShield5 = shield5;
            this.savedShield6 = shield6;

            // shield reinforcement: neither type carries over between turns

            this.generalReinforcement = 0;
            this.specificShield1 = 0;
            this.specificShield2 = 0;
            this.specificShield3 = 0;
            this.specificShield4 = 0;
            this.specificShield5 = 0;
            this.specificShield6 = 0;

            // damage control: points allocated per shield this turn,
            // pending repair application at endTurn() ("end of the

            // shield. Capped ship-wide by the sum of intact damageCon box
            // values (see getDamageConMax()) - not a power cost, so this
            // is tracked and validated separately from the power budget.
            this.damageControlShield1 = 0;
            this.damageControlShield2 = 0;
            this.damageControlShield3 = 0;
            this.damageControlShield4 = 0;
            this.damageControlShield5 = 0;
            this.damageControlShield6 = 0;
        }
        var shipInternals = [];


        shipList[0] = new shipType(1, 'CA', 10, 10, 0, 7, 7, 8, 3);  // FED CA

      */
        shipList[0].shipWeapons[0] = new weaponEntryType(1, 13, 2, 300, 120, 0, 0);
        shipList[0].shipWeapons[1] = new weaponEntryType(2, 13, 2, 300, 120, 0, 0);
        shipList[0].shipWeapons[2] = new weaponEntryType(3, 13, 2, 300, 120, 0, 0);

        shipList[0].shipWeapons[4] = new weaponEntryType(5, 1, 1, 0, 360, 0, 0);
        shipList[0].shipWeapons[5] = new weaponEntryType(6, 1, 1, 0, 360, 0, 0);
        shipList[0].shipWeapons[6] = new weaponEntryType(7, 1, 1, 300, 120, 0, 0);
        shipList[0].shipWeapons[7] = new weaponEntryType(8, 1, 1, 300, 120, 0, 0);
        shipList[0].shipWeapons[8] = new weaponEntryType(9, 1, 1, 240, 120, 0, 0);
        shipList[0].shipWeapons[9] = new weaponEntryType(10, 1, 1, 240, 120, 0, 0);
        shipList[0].shipWeapons[10] = new weaponEntryType(11, 1, 1, 0, 120, 0, 0);
        shipList[0].shipWeapons[11] = new weaponEntryType(12, 1, 1, 0, 120, 0, 0);
        shipInternals[0].sensor = [[6, 1], [6, 1], [5, 1], [3, 1], [1, 1], [0, 1]];
        shipInternals[0].scanner = [[0, 1], [0, 1], [1, 1], [3, 1], [5, 1], [9, 1]];
        shipInternals[0].damageCon = [[4, 1], [4, 1], [2, 1], [2, 1], [2, 1], [0, 1]];

        shipList[1].shipWeapons[0] = new weaponEntryType(1, 10, 2, 300, 120, 0, 0);
        shipList[1].shipWeapons[1] = new weaponEntryType(2, 10, 2, 300, 120, 0, 0);
        shipList[1].shipWeapons[2] = new weaponEntryType(3, 10, 2, 300, 120, 0, 0);
        shipList[1].shipWeapons[3] = new weaponEntryType(4, 10, 2, 300, 120, 0, 0);
        shipList[1].shipWeapons[4] = new weaponEntryType(5, 35, 4, 0, 360, 0, 0);
        shipList[1].shipWeapons[5] = new weaponEntryType(6, 35, 4, 0, 360, 0, 0);
        // custom initial loadout for the D7's drone racks - each Drone F
        // rack has 4 spaces (weapons.json powerCost). setupDroneLoadouts()
        // (see below) leaves this alone instead of overwriting it with the
        // all-Type-I default, since it's not empty. Total spaces used must

        shipList[1].shipWeapons[4].droneInitialLoadout = { 'Type-I': 2, 'Type-IV': 1 };
        shipList[1].shipWeapons[5].droneInitialLoadout = { 'Type-I': 2, 'Type-IV': 1 };
        shipList[1].shipWeapons[6] = new weaponEntryType(7, 2, 1, 240, 240, 0, 0);
        shipList[1].shipWeapons[7] = new weaponEntryType(8, 2, 1, 240, 240, 0, 0);
        shipList[1].shipWeapons[8] = new weaponEntryType(9, 2, 1, 240, 240, 0, 0);
        shipList[1].shipWeapons[9] = new weaponEntryType(10, 2, 1, 240, 120, 120, 60);
        shipList[1].shipWeapons[10] = new weaponEntryType(11, 2, 1, 0, 120, 180, 60);
        shipList[1].shipWeapons[11] = new weaponEntryType(12, 2, 1, 180, 120, 0, 0);
        shipList[1].shipWeapons[12] = new weaponEntryType(13, 2, 1, 180, 120, 0, 0);
        shipList[1].shipWeapons[13] = new weaponEntryType(14, 2, 1, 60, 120, 0, 0);
        shipList[1].shipWeapons[14] = new weaponEntryType(15, 2, 1, 60, 120, 0, 0);
        shipInternals[1].sensor = [[6, 1], [6, 1], [5, 1], [3, 1], [1, 1], [0, 1]];
        shipInternals[1].scanner = [[0, 1], [0, 1], [1, 1], [3, 1], [5, 1], [9, 1]];
        shipInternals[1].damageCon = [[4, 1], [4, 1], [2, 1], [2, 1], [2, 1], [0, 1]];


        var curShipId = 1;
        var curShipArrId = 0;

        $(function () {
            // Load weapon damage tables + Damage Allocation Chart before
            // anything that might reference weaponList/dacChart runs.
            Promise.all([
                loadWeapons('data/weapons.json'),
                loadDacChart('data/dac-chart.json'),
                loadDroneTypes('data/drone-types.json')
            ]).then(function () {
                try {
                    initGame();
                } catch (err) {
                    console.error('Game failed to initialize:', err);
                    $('#dataDiv').append('<div style="color:red;">Game failed to initialize: ' + err.message + '</div>');
                }
            }).catch(function (err) {
                console.error('Failed to load chart data:', err);
                $('#dataDiv').append('<div style="color:red;">Failed to load chart data: ' + err.message + '</div>');
            });
        });

        // --- drone loadout helpers (mixed drone types per rack) ---

        // total spaces occupied by a loadout object { "Type-I": count, ... }
        function droneLoadoutSpaceUsed(loadout) {
            var total = 0;
            for (var t in loadout) {
                if (loadout[t] > 0) total += loadout[t] * getDroneTypeByName(t).space;
            }
            return total;
        }

        // total individual drones (regardless of type) in a loadout object
        function droneLoadoutCount(loadout) {
            var total = 0;
            for (var t in loadout) { total += loadout[t] || 0; }
            return total;
        }

        // adds one loadout object's counts into another (used to build the
        // ship stockpile as the sum of every rack's initial loadout)
        function addLoadoutInto(target, source) {
            for (var t in source) {
                target[t] = (target[t] || 0) + source[t];
            }
        }

        // human-readable breakdown for display: "Type-I x2, Type-IV x1 (4/4 sp)"
        function formatDroneLoadout(loadout, spaceCapacity) {
            var parts = [];
            for (var t in loadout) {
                if (loadout[t] > 0) parts.push(t + ' x' + loadout[t]);
            }
            var summary = parts.length > 0 ? parts.join(', ') : 'empty';
            return summary + ' (' + droneLoadoutSpaceUsed(loadout) + '/' + spaceCapacity + ' sp)';
        }

        // moves up to budgetSpaces worth of drones from the ship stockpile
        // into a rack, drawing on chosenType if the rack was completely
        // empty (no established mix to go by), or otherwise restoring
        // toward the rack's own droneInitialLoadout - round-robin across
        // whichever types are still short, one drone at a time, until the
        // budget/capacity/stockpile runs out. Returns { added, spacesUsed }.
        function applyDroneReload(rack, ship, budgetSpaces, chosenType) {
            var added = {};
            var spacesUsed = 0;
            var remainingCapacity = rack.droneRackSpaceCapacity - droneLoadoutSpaceUsed(rack.droneLoadout);
            var isEmpty = droneLoadoutCount(rack.droneLoadout) <= 0;
            var typeOrder = isEmpty ? [chosenType] : Object.keys(rack.droneInitialLoadout);

            var progress = true;
            while (spacesUsed < budgetSpaces && remainingCapacity > 0 && progress) {
                progress = false;
                for (var i = 0; i < typeOrder.length; i++) {
                    var t = typeOrder[i];
                    if (!t) continue;
                    var typeSpace = getDroneTypeByName(t).space;
                    if (spacesUsed + typeSpace > budgetSpaces) continue;
                    if (typeSpace > remainingCapacity) continue;
                    if (!isEmpty) {
                        var deficit = (rack.droneInitialLoadout[t] || 0) - (rack.droneLoadout[t] || 0);
                        if (deficit <= 0) continue;
                    }
                    if ((ship.droneStockpile[t] || 0) <= 0) continue;

                    rack.droneLoadout[t] = (rack.droneLoadout[t] || 0) + 1;
                    ship.droneStockpile[t] -= 1;
                    added[t] = (added[t] || 0) + 1;
                    spacesUsed += typeSpace;
                    remainingCapacity -= typeSpace;
                    progress = true;
                }
            }
            return { added: added, spacesUsed: spacesUsed };
        }

        // sets up drone loadouts for every ship: each rack (weaponClassId 4)
        // gets a fixed space capacity (weaponList[...].powerCost,
        // repurposed for drones - drones themselves cost no power to use,
        // so that field is otherwise unused for weaponClassId 4) and an
        // initial loadout filling that capacity.
        //
        // DEFAULT: every rack starts 100% Type-I. Edit a rack's
        // droneInitialLoadout below for an actual mixed loadout, e.g.
        // { "Type-I": 2, "Type-IV": 1 } for a 4-space rack (2*1 + 1*2 = 4).
        //
        // The ship's shared reload stockpile mirrors the sum of every one
        // of its racks' initial loadouts, type-for-type - so reloading a
        // rack has something matching its original mix to draw from.
        function setupDroneLoadouts() {
            for (var s = 0; s < shipList.length; s++) {
                var ship = shipList[s];
                var stockpile = {};
                var stockpileSpaceMax = 0;
                for (var w = 0; w < ship.shipWeapons.length; w++) {
                    var wEntry = ship.shipWeapons[w];
                    if (wEntry.weaponClassId != 4) continue;
                    for (var y = 0; y < weaponList.length; y++) {
                        if (weaponList[y].weaponTypeId != wEntry.weaponTypeId) continue;
                        var capacity = weaponList[y].powerCost;
                        wEntry.droneRackSpaceCapacity = capacity;
                        // if a custom loadout was already set on this rack
                        // (see the ship setup block above, near where
                        // shipWeapons are defined) leave it alone - only
                        // fall back to the all-Type-I default if nothing
                        // was specified
                        if (Object.keys(wEntry.droneInitialLoadout).length === 0) {
                            wEntry.droneInitialLoadout = { 'Type-I': capacity };
                        }
                        wEntry.droneLoadout = {};
                        addLoadoutInto(wEntry.droneLoadout, wEntry.droneInitialLoadout);
                        // ADD-Charge (Drone-G's hybrid ammo, see fireADD())
                        // doesn't count toward the drone stockpile - it
                        // reloads from the separate ship.addStockpile pool
                        // instead, with its own rules (2x capacity, +4/turn
                        // if unused, no manual reload checkbox)
                        var droneOnlyLoadout = {};
                        for (var t in wEntry.droneInitialLoadout) {
                            if (t != 'ADD-Charge') droneOnlyLoadout[t] = wEntry.droneInitialLoadout[t];
                        }
                        addLoadoutInto(stockpile, droneOnlyLoadout);
                        stockpileSpaceMax += capacity - droneLoadoutSpaceUsed({ 'ADD-Charge': wEntry.droneInitialLoadout['ADD-Charge'] || 0 });

        function findDistToDrone(sId, droneId) {

                if (activeDrones[i].id == droneId) { x2 = activeDrones[i].xCord; y2 = activeDrones[i].yCord; }
            }
            var dx = Math.abs(x1 - x2);
            var dy = Math.abs(y1 - y2);
            var d = dx;
            var a = dy - Math.floor(dx / 2);
            if (((x1 % 2) == 0) && ((x2 % 2) == 1) && (y1 < y2)) a--;
            if (((x1 % 2) == 1) && ((x2 % 2) == 0) && (y1 > y2)) a--;
            if (a > 0) d += a;
            return d;

            var x1, y1, f1, x2, y2;
            for (var z = 0; z < shipList.length; z++) {
                if (shipList[z].userId == sId) { x1 = shipList[z].xCord; y1 = shipList[z].yCord; f1 = shipList[z].facing; }

        function turnBracketsDisplay(turnModeArr) {
            var parts = [];
            var prevThreshold = 1; // speed 1 needs only 1 hex between turns, which is trivially satisfied every impulse at that speed - skip listing it, brackets start at 2
            for (var z = 0; z < turnModeArr.length; z++) {

        function connect(x1, y1, x2, y2) { // draw a line connecting elements
            // distance
            var length = Math.sqrt(((x2 - x1) * (x2 - x1)) + ((y2 - y1) * (y2 - y1)));
            // center
            var cx = ((x1 + x2) / 2) - (length / 2);
            var cy = ((y1 + y2) / 2) - (1 / 2);
            // angle
            var angle = Math.atan2((y1 - y2), (x1 - x2)) * (180 / Math.PI);
            // make hr
            var htmlLine = '<div style="height:1px;background-color:black;position:absolute;left:' + cx + 'px;top:' + cy + 'px;width:' + length + 'px;';
            htmlLine += '-moz-transform:rotate(' + angle + 'deg);-webkit-transform:rotate(' + angle + 'deg);-o-transform:rotate(' + angle + 'deg);';
            htmlLine += '-ms-transform:rotate(' + angle + 'deg);transform:rotate(' + angle + 'deg);"/>';
            //
            // alert(htmlLine);
            return htmlLine;
        }


        function writeLine(arc, range) {
            // assume 200, 200 start point
            var x = range * Math.cos(arc * (Math.PI / 180)) + 200;
            var y = range * Math.sin(arc * (Math.PI / 180)) + 200;

            var s = connect(200, 200, x, y);

            var str = '<div>r=' + range + ' a=' + arc + ' x=' + x + ' y=' + y + '</div>';
            $('#dataDiv').append(str);
            return s;
        }

            ctx.closePath();

        function drawGrid(width, height) {
            //for (let y = r; y + r * 2 * Math.sin(a) < height; y += r * 2 * Math.sin(a)) {
            for (let y = HexR; y + HexR * Math.sin(HexA) < height; y += HexR * Math.sin(HexA)) {
                for (let x = HexR, j = 0; x + HexR * (1 + Math.cos(HexA)) < width; x += HexR * (1 + Math.cos(HexA)), y += (-1) ** j++ * HexR * Math.sin(HexA)) {

        function launchDrone(sArrId, wArrId, targetType, targetId, weapon, chosenTypeName) {
            var launcher = shipList[sArrId];
            var rack = launcher.shipWeapons[wArrId];
            if (!rack.droneLoadout[chosenTypeName] || rack.droneLoadout[chosenTypeName] <= 0) {
                $('#dataDiv').append('<div style="color:#900;">' + launcher.name + '\'s ' + weapon.weaponName + ' has no ' + chosenTypeName + ' drones loaded</div>');

                droneType.speed,
                droneType.hitPoints,

                4,

            );

                drone.approachBearingToTarget = (target.x == drone.xCord && target.y == drone.yCord)

        function seekingWeaponType(id, ownerShipId, targetType, targetId, xCord, yCord, facing, speed, hitPoints, damage, turnsRemaining, weaponClassId, droneTypeName) {

        // move seeking weapons
        function moveSeeking() {
            // process the whole per-impulse queue in one pass - no popup
            // needed since v1 drone movement is fully automatic (always
            // turns toward its target as hard as it can)
            if (seekingList.length > 0) setPhase('Seeking Weapons');
            while (seekingList.length > 0) {

                seekingList.shift();

        // looks up a seeking weapon's current target - either a ship
        // (targetType 'ship', targetId = userId) or another drone
        // (targetType 'drone', targetId = drone id) - and returns its
        // position/facing/name in one shape so movement and impact
        // resolution don't need to care which kind it is.
        // Type-VI drones deal damage based on the target ship's size class
        // (1 = biggest, 7 = smallest) instead of a flat amount. Other
        // drone types are unaffected - see resolveSeeking()'s ship-impact
        // branch, the only place this is consulted.
        function getTypeVIDamage(sizeClass) {
            if (sizeClass >= 6) return 8;
            if (sizeClass == 5) return 4;
            return 2; // size class 1-4
        }

        function getSeekingTargetInfo(targetType, targetId) {
            if (targetType == 'drone') {
                for (var i = 0; i < activeDrones.length; i++) {
                    if (activeDrones[i].id == targetId && !activeDrones[i].bDestroyed) {
                        var d = activeDrones[i];
                        return { exists: true, x: d.xCord, y: d.yCord, facing: d.facing, name: (d.droneTypeName || 'Drone') + ' #' + d.id };
                    }
                }
                return { exists: false };
            }
            for (var z = 0; z < shipList.length; z++) {
                if (shipList[z].userId == targetId) {
                    var s = shipList[z];
                    return { exists: true, x: s.xCord, y: s.yCord, facing: s.facing, name: s.name, sizeClass: s.sizeClass, isShuttle: s.isShuttle };
                }
            }
            return { exists: false };
        }

        // moves one seeking weapon one hex toward its target's current position
        function moveSeekingWeapon(id) {
            var drone = null;
            for (var i = 0; i < activeDrones.length; i++) {
                if (activeDrones[i].id == id) { drone = activeDrones[i]; }
            }
            if (!drone || drone.bDestroyed) return;

            var target = getSeekingTargetInfo(drone.targetType, drone.targetId);
            if (!target.exists) {
                // target was destroyed by something else before this drone
                // reached it (or, for a drone chasing a shuttle, the
                // shuttle docked - though that case retargets the drone to
                // the mothership in dockShuttle() before this ever runs,
                // so it won't hit this branch). Nothing left to home in on.
                $('#dataDiv').append('<div>' + (drone.droneTypeName || 'Drone') + ' #' + drone.id + ' loses its target and self-destructs</div>');
                removeActiveDrone(drone);
                return;
            }

            // already on the target's hex (e.g. the target moved onto us
            // this impulse) - don't move away chasing a degenerate
            // zero-distance bearing (atan2(0,0) always resolves to a fixed
            // direction, which would otherwise deterministically walk the
            // drone off the target before resolveSeeking() can register
            // the hit). Just stay put.
            if (drone.xCord == target.x && drone.yCord == target.y) return;

            var bearing = bearingBetweenCoords(drone.xCord, drone.yCord, target.x, target.y);
            // capture this position's bearing to the target BEFORE moving -
            // if this move lands the drone on the target, resolveSeeking()
            // needs this (the post-move, same-hex bearing would be
            // degenerate)
            drone.approachBearingToTarget = bearingBetweenCoords(target.x, target.y, drone.xCord, drone.yCord);
            var dir = nearestHexDirection(bearing);
            var next = hexNeighbor(drone.xCord, drone.yCord, dir);

            drone.xCord = next.x;
            drone.yCord = next.y;
            drone.facing = dir;
            updateSeekingWeaponPosition(drone);
        }

        // world-frame bearing (0=up, 60, 120, 180, 240, 300) from one hex
        // to another - same trig as findFacing() but without subtracting a
        // reference facing, since here we want an absolute direction to
        // snap to the nearest hex neighbor rather than an arc-relative angle
        function bearingBetweenCoords(x1, y1, x2, y2) {
            var dx = (x2 - x1);
            var dy = (y2 - y1);
            var mx = dx * 0.866;
            var my = -dy;
            if ((x1 % 2 == 0) && ((x2 % 2) == 1)) my += 0.5;
            if ((x1 % 2 == 1) && ((x2 % 2) == 0)) my -= 0.5;
            var angle = Math.round(Math.atan2(my, mx) * (180 / Math.PI) * 100) / 100;
            if (angle > 90) angle = 450 - angle; else angle = 90 - angle;
            if (angle >= 360) angle -= 360;
            if (angle < 0) angle += 360;
            return angle;
        }

        function nearestHexDirection(angle) {
            var dirs = [0, 60, 120, 180, 240, 300];
            var best = 0, bestDiff = 361;
            for (var i = 0; i < dirs.length; i++) {
                var diff = Math.abs(angle - dirs[i]);
                if (diff > 180) diff = 360 - diff;
                if (diff < bestDiff) { bestDiff = diff; best = dirs[i]; }
            }
            return best;
        }

        // one hex step in a given facing direction - same neighbor math
        // moveShip() uses, but standalone so it works for anything with
        // raw x/y coordinates, not just entries in shipList
        function hexNeighbor(x, y, facing) {
            var a = 1;
            if (facing == 60) a = 2;
            if (facing == 120) a = 3;
            if (facing == 180) a = 4;
            if (facing == 240) a = 5;
            if (facing == 300) a = 6;

            var nx = x, ny = y;
            if (a == 1) { ny = y - 1; }
            else if (a == 2) { nx = x + 1; ny = (x % 2 == 0) ? y : (y - 1); }
            else if (a == 3) { nx = x + 1; ny = (x % 2 == 0) ? (y + 1) : y; }
            else if (a == 4) { ny = y + 1; }
            else if (a == 5) { nx = x - 1; ny = (x % 2 == 0) ? (y + 1) : y; }
            else if (a == 6) { nx = x - 1; ny = (x % 2 == 0) ? y : (y - 1); }
            return { x: nx, y: ny };
        }
        // resolve seeking weapons
        function resolveSeeking() {
            // iterate a snapshot, not the live array - a drone-vs-drone
            // impact can remove TWO entries (attacker + target) in a
            // single pass via removeActiveDrone()'s splice, which shifts
            // activeDrones and would otherwise leave this loop reading a
            // stale/out-of-bounds index. bDestroyed is still set
            // synchronously before the splice, so already-resolved drones
            // (destroyed earlier in this same pass) are still skipped
            // correctly via the check below.
            var dronesToCheck = activeDrones.slice();
            for (var i = dronesToCheck.length - 1; i >= 0; i--) {
                var drone = dronesToCheck[i];
                if (drone.bDestroyed) continue;

                var target = getSeekingTargetInfo(drone.targetType, drone.targetId);
                if (!target.exists) continue;

                if (drone.xCord == target.x && drone.yCord == target.y) {
                    var ownerName = '';
                    for (var zz = 0; zz < shipList.length; zz++) {
                        if (shipList[zz].userId == drone.ownerShipId) { ownerName = shipList[zz].name; }
                    }

                    if (drone.targetType == 'drone') {
                        // drone-vs-drone: no shields to resolve through -
                        // apply damage straight to the target drone's hit
                        // points, same as direct-fire weapons do via
                        // fireWeaponAtDrone(). The attacking drone is
                        // always consumed on impact regardless of outcome.
                        var targetDrone = null;
                        for (var td = 0; td < activeDrones.length; td++) {
                            if (activeDrones[td].id == drone.targetId) { targetDrone = activeDrones[td]; }
                        }
                        if (targetDrone) {
                            targetDrone.hitPoints -= drone.damage;
                            $('#dataDiv').append('<div>' + ownerName + ' ' + (drone.droneTypeName || 'drone') + ' #' + drone.id + ' impacts ' + target.name + ' -- ' + drone.damage + ' damage (HP ' + Math.max(targetDrone.hitPoints, 0) + '/' + targetDrone.maxHitPoints + ')</div>');
                            if (targetDrone.hitPoints <= 0) {
                                $('#dataDiv').append('<div>' + target.name + ' destroyed</div>');
                                removeActiveDrone(targetDrone);
                            }
                        }
                        removeActiveDrone(drone);
                    } else {
                        // impact - resolve which shield it hits using the
                        // bearing captured just BEFORE this collision (see
                        // approachBearingToTarget). Recomputing it now would be
                        // meaningless, since a collision means the drone and
                        // target are, by definition, in the same hex at this
                        // point - bearingBetweenCoords() on identical
                        // coordinates always degenerates to a fixed value
                        // (atan2(0,0)), which was the real bug here even after
                        // the target-facing fix from last session.
                        var approachBearing = (drone.approachBearingToTarget != null) ? drone.approachBearingToTarget : bearingBetweenCoords(target.x, target.y, drone.xCord, drone.yCord);
                        var arc = approachBearing - target.facing;
                        if (arc < 0) arc += 360;
                        if (arc >= 360) arc -= 360;
                        var shieldHit = shieldFacing(arc);
                        var impactDamage = (drone.droneTypeName == 'Type-VI') ? getTypeVIDamage(target.sizeClass) : drone.damage;

                        // shuttles have no shields - shieldHit is still
                        // computed below for the damageList entry's shape,
                        // but applyDamage()'s isShuttle bypass ignores it
                        // and applies flat HP loss instead, so don't imply
                        // shield absorption in the log for one
                        if (target.isShuttle) {
                            $('#dataDiv').append('<div>' + ownerName + ' ' + (drone.droneTypeName || 'drone') + ' #' + drone.id + ' impacts ' + target.name + ' -- ' + impactDamage + ' damage</div>');
                        } else {
                            $('#dataDiv').append('<div>' + ownerName + ' ' + (drone.droneTypeName || 'drone') + ' #' + drone.id + ' impacts ' + target.name + ' -- ' + impactDamage + ' damage to shield #' + shieldHit + '</div>');
                        }

                        var bAdded = false;
                        for (var z = 0; z < damageList.length; z++) {
                            if (damageList[z].targetId == drone.targetId && damageList[z].shield == shieldHit) {
                                damageList[z].damage += impactDamage;
                                bAdded = true;
                            }
                        }
                        if (!bAdded) damageList[damageList.length] = new damageListType(drone.targetId, shieldHit, impactDamage);

                        removeActiveDrone(drone);
                    }
                }
            }

            cloakPhase();
        }

        // step 4: cloak/uncloak - not implemented yet, placeholder
        function cloakPhase() {
            tractorBeamPhase();
        }

        // step 5: tractor beams - not implemented yet, placeholder
        function tractorBeamPhase() {
            fireSeekingWeapons();
        }

        // step 6: launch seeking weapons (drones)
        function fireSeekingWeapons() {
            // cycle through weapons queued to launch this impulse; when none remain, move on
            if (launchSeekingList.length == 0)
                shieldTransporterPhase();
            else
                launchSeekingList.shift();
        }

        // step 7: shields/transporters - shield activation itself is
        // already handled per-turn via energy allocation, not per-impulse;
        // transporters aren't implemented yet. Placeholder for now.
        function shieldTransporterPhase() {
            shuttleLaunchCounts = {};
            shuttleDockCounts = {};
            recoverShuttleList = shipList.map(function (s) { return s.userId; });
            recoverShuttlecraft();
        }

        // step 8: recover shuttlecraft - offers docking to every eligible
        // shuttle this impulse (silently skipping ships/shuttles that
        // aren't currently in range of their mothership), then moves on
        function recoverShuttlecraft() {
            while (recoverShuttleList.length > 0) {
                var sId = recoverShuttleList[0];
                var arrId = findShipArrId(sId);
                if (arrId == -1) { recoverShuttleList.shift(); continue; }
                var ship = shipList[arrId];
                if (ship.isShuttle && findDist(ship.userId, ship.ownerShipId) == 0) {
                    var motherArrIdCheck = findShipArrId(ship.ownerShipId);
                    var dockLimit = (motherArrIdCheck != -1) ? shipList[motherArrIdCheck].shuttleOpsPerImpulse : 1;
                    if ((shuttleDockCounts[ship.ownerShipId] || 0) < dockLimit) {
                        curShipId = sId;
                        setSelfHexHighlight(sId);
                        recoverShuttlecraftPopUp(sId);
                        return;
                    }
                }
                recoverShuttleList.shift();
            }
            clearSelfHexHighlight();
            launchShuttleList = shipList.map(function (s) { return s.userId; });
            launchShuttlecraft();
        }

        function recoverShuttlecraftPopUp(sId) {
            var arrId = findShipArrId(sId);

            str += '<div class="button" style="float:right;padding:2px 8px;" onclick="doneRecoverShuttlecraft();">Done</div>';
            str += '<div style="clear:both;"></div>';
            if (motherArrId != -1) {
                str += '<div class="weaponFireDiv canTargetHighlight" onclick="dockShuttle(' + arrId + ');">Dock with ' + shipList[motherArrId].name + '</div>';
            }
            $('#fireShipPopUpDiv').html(str).css('display', 'block');
        }

        function doneRecoverShuttlecraft() {
            $('#fireShipPopUpDiv').css('display', 'none');
            recoverShuttleList.shift();
            recoverShuttlecraft();
        }

        // step 9: launch shuttlecraft - offers launching to every ship with
        // hangar space this impulse, then moves on to direct-fire weapons
        function launchShuttlecraft() {
            while (launchShuttleList.length > 0) {
                var sId = launchShuttleList[0];
                var arrId = findShipArrId(sId);
                if (arrId == -1) { launchShuttleList.shift(); continue; }
                var ship = shipList[arrId];
                if (ship.shuttleHangar > 0 && (shuttleLaunchCounts[ship.userId] || 0) < ship.shuttleOpsPerImpulse) {
                    curShipId = sId;
                    setSelfHexHighlight(sId);
                    launchShuttlecraftPopUp(sId);
                    return;
                }
                launchShuttleList.shift();
            }
            clearSelfHexHighlight();
            fireShips();
        }

        function launchShuttlecraftPopUp(sId) {
            var arrId = findShipArrId(sId);
            var ship = shipList[arrId];
            var str = '<div style="float:left;">Launch Shuttlecraft: ' + ship.name + '</div>';
            str += '<div class="button" style="float:right;padding:2px 8px;" onclick="doneLaunchShuttlecraft();">Done</div>';
            str += '<div style="clear:both;"></div>';
            str += '<div class="weaponFireDiv canTargetHighlight" onclick="launchShuttle(' + arrId + ');">Launch Shuttle (' + ship.shuttleHangar + '/' + ship.shuttleHangarMax + ' in hangar)</div>';
            $('#fireShipPopUpDiv').html(str).css('display', 'block');
        }

        function doneLaunchShuttlecraft() {
            $('#fireShipPopUpDiv').css('display', 'none');
            launchShuttleList.shift();
            launchShuttlecraft();
        }


        // fire direct-fire weapons
        var currentFirerShieldGroups = []; // range-0 shield groups established so far by the current firer this turn: [{shield, start, arc}, ...]

        // true if at least one of this ship's weapons could conceivably
        // fire this turn - ignores target-specific range/arc (no target is
        // picked yet at this point), just the weapon's own prerequisites:
        // destroyed, cooldown/once-per-turn (via weaponReady, which already
        // covers ADD's no-cooldown exemption and Drone-G's cross-mode
        // exclusivity), armed state for heavy weapons, remaining phaser
        // capacitor, and ammo for drone racks/ADD.
        // Shuttle launch/dock live in their own dedicated impulse phases
        // (steps 8-9, see recoverShuttlecraft()/launchShuttlecraft()) and
        // don't factor in here - transporters, once they exist, may need
        // their own similar phase rather than affecting this check.
        function shipHasFireableWeapon(sId) {
            var arrId = findShipArrId(sId);
            if (arrId == -1) return false;
            var ship = shipList[arrId];

            for (var z = 0; z < ship.shipWeapons.length; z++) {
                var wEntry = ship.shipWeapons[z];
                if (wEntry.bDestroyed) continue;
                if (!weaponReady(wEntry)) continue;
                if (isHeavyWeaponClass(wEntry.weaponClassId) && !wEntry.bArmed) continue;

                var wClass = 0, pCost = 0;
                for (var y = 0; y < weaponList.length; y++) {
                    if (weaponList[y].weaponTypeId == wEntry.weaponTypeId) { wClass = weaponList[y].weaponClassId; pCost = weaponList[y].powerCost; }
                }
                if (wClass == 1 && pCost > ship.phaserCap) continue;
                if (wClass == 4 && (wEntry.bReloading || droneLoadoutCount(wEntry.droneLoadout) <= 0)) continue;
                if (wClass == ADD_WEAPON_CLASS_ID && wEntry.chargesCurrent <= 0) continue;

                return true; // found at least one weapon that could fire
            }
            return false;
        }

        function fireShips() {
            //alert('fire len=' + fireShipList.length + ' 0=' + fireShipList[0])
            if (fireShipList.length == 0) {
                clearFireHexHighlights();
                damageShips();
            } else {
                var candidateShipId = fireShipList[0];
                if (!shipHasFireableWeapon(candidateShipId)) {
                    // nothing left to fire - skip this ship's popup
                    // entirely rather than showing an all-dimmed list
                    fireShipList.shift();
                    fireShips();
                    return;
                }
                setPhase('Fire');
                curShipId = candidateShipId;
                selTargetShipId = -1;
                selTargetDroneId = -1;
                currentFirerShieldGroups = [];
                setSelfHexHighlight(curShipId);
                clearTargetHexHighlight();
                shipFirePopUp();
            }
        }
        // resolve direct-fire weapons
        function damageShips() {
            if (damageList.length == 0)
                endImpluse();
            else {
                setPhase('Damage');
                applyDamage();
            }
        }

        // end impulse
        function endImpluse() {
            impulse++;
            if (impulse > 32) {
                endTurn();
            } else {
                writeImpulseChart();
                oneImpluse();
            }
        }

        // end turn: wrap impulse back to 1, advance the turn counter, and
        // reset per-turn ship/weapon state (nothing previously reset
        // shipWeapons[].bFired, so once a weapon fired it stayed disabled
        // for the rest of the game - this is what actually clears it).
        function endTurn() {
            turnNumber++;
            impulse = 1;

            // shuttles skip energy allocation entirely (see
            // startEnergyAllocation()), so their one Phaser-3 refills for
            // free here instead, once per turn
            for (var su = 0; su < shipList.length; su++) {
                if (shipList[su].isShuttle) shipList[su].phaserCap = shipList[su].maxPhaserCap;
            }

            for (var s = 0; s < shipList.length; s++) {
                for (var w = 0; w < shipList[s].shipWeapons.length; w++) {
                    var wEntry = shipList[s].shipWeapons[w];
                    // disruptors can't hold a charge between turns - if it's
                    // still armed at end of turn, it never fired, so it
                    // discharges and must be paid for again next turn.
                    // (photons are unaffected - their multi-round loading
                    // and maintenance mechanic is unchanged)
                    // captured BEFORE bFired resets below - needed for the
                    // ADD/Drone-G reload check further down, which cares
                    // whether the weapon fired (in ANY mode) during the
                    // turn that just ended
                    var firedLastTurn = wEntry.bFired || wEntry.addFiredThisTurn;

                    if (wEntry.bArmed && isDisruptorWeaponTypeId(wEntry.weaponTypeId)) {
                        $('#dataDiv').append('<div>' + shipList[s].name + '\'s disruptor [' + w + '] charge lost - did not fire</div>');
                        wEntry.bArmed = false;
                        wEntry.loadType = null;
                    }
                    wEntry.bFired = false;
                    wEntry.impFired = 0;
                    wEntry.bReloading = false;

                    // ADD racks (and Drone-G, firing in its hybrid ADD
                    // mode): if a rack didn't fire even once - in ANY mode,
                    // for Drone-G - during the turn that just ended, it
                    // recovers up to 4 charges from the ship's shared
                    // stockpile. Dedicated ADD racks store charges directly
                    // (chargesCurrent/chargesMax); Drone-G's ADD-Charge
                    // ammo lives in its shared drone loadout instead, so its
                    // headroom is whatever rack space isn't already used.
                    // Checked here (turn boundary, right before the new
                    // turn's energy allocation) rather than in the popup
                    // itself, so it runs exactly once per turn no matter how
                    // many times that popup gets opened/re-rendered.
                    if (wEntry.weaponClassId == ADD_WEAPON_CLASS_ID) {
                        if (!firedLastTurn) {
                            var addReloadAmt = Math.min(4, wEntry.chargesMax - wEntry.chargesCurrent, shipList[s].addStockpile);
                            if (addReloadAmt > 0) {
                                wEntry.chargesCurrent += addReloadAmt;
                                shipList[s].addStockpile -= addReloadAmt;
                                $('#dataDiv').append('<div>' + shipList[s].name + '\'s ADD [' + (w + 1) + '] didn\'t fire last turn - reloads +' + addReloadAmt + ' charges (' + wEntry.chargesCurrent + '/' + wEntry.chargesMax + ', stockpile ' + shipList[s].addStockpile + ')</div>');
                            }
                        }
                        wEntry.addFiredThisTurn = false; // reset for the new turn
                    } else if (wEntry.weaponTypeId == DRONE_G_WEAPON_TYPE_ID) {
                        if (!firedLastTurn) {
                            var addChargeSpace = getDroneTypeByName('ADD-Charge').space; // 0.5 - two charges fit per space
                            var droneGHeadroomSpace = wEntry.droneRackSpaceCapacity - droneLoadoutSpaceUsed(wEntry.droneLoadout);
                            var droneGHeadroomUnits = Math.floor(droneGHeadroomSpace / addChargeSpace);
                            var droneGReloadAmt = Math.min(4, droneGHeadroomUnits, shipList[s].addStockpile);
                            if (droneGReloadAmt > 0) {
                                wEntry.droneLoadout['ADD-Charge'] = (wEntry.droneLoadout['ADD-Charge'] || 0) + droneGReloadAmt;
                                shipList[s].addStockpile -= droneGReloadAmt;
                                $('#dataDiv').append('<div>' + shipList[s].name + '\'s Drone G [' + (w + 1) + '] didn\'t fire last turn - reloads +' + droneGReloadAmt + ' ADD charges (' + wEntry.droneLoadout['ADD-Charge'] + ', stockpile ' + shipList[s].addStockpile + ')</div>');
                            }
                        }
                        wEntry.addFiredThisTurn = false; // reset for the new turn
                    }
                }
                // phaserCap no longer auto-recharges - it's set entirely by
                // energy allocation now (see startEnergyAllocation() below)

                // shield reinforcement (general and specific) never carries
                // over - reset here so nothing lingers between combat
                // resolving and the next allocation phase setting it fresh
                for (var iz = 0; iz < shipInternals.length; iz++) {
                    if (shipInternals[iz].userId == shipList[s].userId) {
                        shipInternals[iz].generalReinforcement = 0;
                        for (var sf = 1; sf <= 6; sf++) { shipInternals[iz]['specificShield' + sf] = 0; }

                        // damage control repairs apply now - "end of the
                        // round" - then the allocation resets for the new
                        // turn. 2 points allocated repairs 1 point of that
                        // shield, capped so it can't repair past max.
                        for (var dcf = 1; dcf <= 6; dcf++) {
                            var dcAllocated = shipInternals[iz]['damageControlShield' + dcf];
                            if (dcAllocated > 0) {
                                var repairAmt = Math.floor(dcAllocated / 2);
                                var before = shipInternals[iz]['shield' + dcf];
                                var after = Math.min(shipInternals[iz]['mShield' + dcf], before + repairAmt);
                                shipInternals[iz]['shield' + dcf] = after;
                                if (after > before) {
                                    $('#dataDiv').append('<div>' + shipList[s].name + ' damage control repairs shield #' + dcf + ' +' + (after - before) + ' (now ' + after + '/' + shipInternals[iz]['mShield' + dcf] + ')</div>');
                                }
                            }
                            shipInternals[iz]['damageControlShield' + dcf] = 0;
                        }
                    }
                }
            }

            // expire seeking weapons whose endurance has run out
            for (var i = activeDrones.length - 1; i >= 0; i--) {
                activeDrones[i].turnsRemaining--;
                if (activeDrones[i].turnsRemaining <= 0) {
                    $('#dataDiv').append('<div>Drone #' + activeDrones[i].id + ' runs out of endurance and self-destructs</div>');
                    removeActiveDrone(activeDrones[i]);
                }
            }

            $('#turnDetailsDiv').html('<div style="font-weight:bold;padding-top:4px;">--- Turn ' + turnNumber + ' begins ---</div>');
            writeImpulseChart();
            startEnergyAllocation();
        }

        function closePopup(str) {
            $('#' + str + 'PopUpDiv').css('display', 'none');
            if (str == 'hexPicker') { $('#hexPickerBackdrop').css('display', 'none'); }
        }
        function openPopUp(str) {
            $('#' + str + 'PopUpDiv').css('display', 'block');
        }


        function shipMovePopUp(sId) {
            $('#moveShipPopUpDiv').css('background-color', getTeamBgColor(sId));
            var arrId1 = -1;
            for (var z = 0; z < shipList.length; z++) {
                if (shipList[z].userId == sId) { arrId1 = z; }
            }
            var ship = shipList[arrId1];
            var turnStatus = shipTurnStatus(ship);

            if (bTurn)
                str += '<div class="button" style="width:20px;" onclick="turnShip(' + sId + ',-1);" onmouseover="potentialMove(' + sId + ',-1,-1);" onmouseout="clearPotentialMove();">L</div>';
            str += '<div class="button" style="width:20px;" onclick="moveShip(' + sId + ', 0);" onmouseover="potentialMove(' + sId + ',0,0);" onmouseout="clearPotentialMove();">F</div>';

                str += '<div class="button" style="width:20px;" onclick="turnShip(' + sId + ',1);" onmouseover="potentialMove(' + sId + ',1,1);" onmouseout="clearPotentialMove();">R</div>';
            if (ship.sideSlip)
                str += '<div class="button" style="width:20px;" onclick="moveShip(' + sId + ', 1);" onmouseover="potentialMove(' + sId + ',1,0);" onmouseout="clearPotentialMove();">sR</div>';

            str += '<div style="clear:both;"></div>';

            $('#turnDetailsDiv').append('<div>Move Ship: ' + ship.name + ' id=' + sId + ' ');
            $('#moveShipPopUpDiv').html(str).css('display', 'block');
        }
        function turnShip(sId, t) {
            var arrId1 = -1;
            for (var z = 0; z < shipList.length; z++) {
                if (shipList[z].userId == sId) { arrId1 = z; }
            }
            var f = shipList[arrId1].facing;
            f += ((t == -1) ? -60 : 60);
            if (f > 300) f = 0;
            if (f < 0) f = 300;
            shipList[arrId1].facing = f;
            shipList[arrId1].turnMarker = -1;
            shipList[arrId1].sideSlip = true;

            $('#turnDetailsDiv').append('turn ' + ((t == -1) ? 'left' : 'right'));
            moveShip(sId, 0);
        }
        function moveShip(sId, m) {
            var arrId1 = -1;
            for (var z = 0; z < shipList.length; z++) {
                if (shipList[z].userId == sId) { arrId1 = z; }
            }
            var f = shipList[arrId1].facing;
            var x = shipList[arrId1].xCord;
            var y = shipList[arrId1].yCord;
            var a = 1;
            if (f == 60) a = 2;
            if (f == 120) a = 3;
            if (f == 180) a = 4;
            if (f == 240) a = 5;
            if (f == 300) a = 6;
            a += m;
            shipList[arrId1].sideSlip = ((m != 0) ? false : true);
            shipList[arrId1].turnMarker++;

            if (a == 1 || a == 7) { shipList[arrId1].yCord = (y - 1); }
            if (a == 2) { shipList[arrId1].xCord = (x + 1); shipList[arrId1].yCord = ((x % 2 == 0) ? y : (y - 1)); }
            if (a == 3) { shipList[arrId1].xCord = (x + 1); shipList[arrId1].yCord = ((x % 2 == 0) ? (y + 1) : y); }
            if (a == 4) { shipList[arrId1].yCord = (y + 1); }
            if (a == 5) { shipList[arrId1].xCord = (x - 1); shipList[arrId1].yCord = ((x % 2 == 0) ? (y + 1) : y); }
            if (a == 6 || a == 0) { shipList[arrId1].xCord = (x - 1); shipList[arrId1].yCord = ((x % 2 == 0) ? y : (y - 1)); }
            plotShip(sId);

            if (m != 0) $('#turnDetailsDiv').append(((m == -1) ? 'slip left' : 'slip right'));
            $('#turnDetailsDiv').append('</div>');
            $('#moveShipPopUpDiv').css('display', 'none');
            $('.posShipMove').remove();
            moveShipList.shift();
            moveShips();
        }

        function potentialMove(sId, m, t) {
            var arrId1 = -1;
            for (var z = 0; z < shipList.length; z++) {
                if (shipList[z].userId == sId) { arrId1 = z; }
            }

        function displayWeaponArc(weapon) {
            var str = '';
            if (weapon.startP == 300 && weapon.arc == 120) { str = 'FA'; }
            if (weapon.startP == 240 && weapon.arc == 240) { str = 'FX'; }
            if (weapon.startP == 120 && weapon.arc == 120) { str = 'RA'; }
            if (weapon.startP == 60 && weapon.arc == 240) { str = 'RX'; }
            if (weapon.startP == 0 && weapon.arc == 360) { str = '360'; }

            if (weapon.startP == 0 && weapon.arc == 120) { str = 'RF R'; }
            if (weapon.startP == 60 && weapon.arc == 120) { str = 'R RR'; }
            if (weapon.startP == 180 && weapon.arc == 120) { str = 'L LR'; }
            if (weapon.startP == 240 && weapon.arc == 120) { str = 'LF L'; }

            if (weapon.startP == 0 && weapon.arc == 120 && weapon.startP2 == 180 && weapon.arc2 == 60) { str = 'RF R LR'; }
            if (weapon.startP == 240 && weapon.arc == 120 && weapon.startP2 == 120 && weapon.arc2 == 60) { str = 'LF L RR'; }

            if (weapon.startP == 0 && weapon.arc == 180) { str = 'RS'; }
            if (weapon.startP == 180 && weapon.arc == 180) { str = 'LS'; }
            if (weapon.startP == 270 && weapon.arc == 180) { str = ((weaponTypeId > 19) ? 'FP' : 'FH'); }

            if (weapon.weaponTypeId >= 30 && weapon.weaponTypeId <= 40) { str = ''; }

            // weapons with extra disjoint arc segments (e.g. a wing phaser with
            // bonus/excluded hexes) won't match any named pattern above -
            // fall back to listing the raw ranges instead of showing nothing
            if (str == '' && weapon.extraArcs && weapon.extraArcs.length > 0) {
                var ranges = [weapon.startP + '-' + (weapon.startP + weapon.arc)];
                if (weapon.arc2 > 0) ranges.push(weapon.startP2 + '-' + (weapon.startP2 + weapon.arc2));
                for (var i = 0; i < weapon.extraArcs.length; i++) {
                    ranges.push(weapon.extraArcs[i].start + '-' + (weapon.extraArcs[i].start + weapon.extraArcs[i].arc));
                }
                str = ranges.join(',');
            }
            return str;
        }
        // true if `angle` (a relative bearing, 0-360) falls within a segment
        // that starts at `start` and spans `span` degrees. Handles segments
        // that wrap past 360 (e.g. start=350, span=30 covers 350-360 and 0-20).
        function isAngleInSegment(angle, start, span) {
            if (!span || span <= 0) return false;
            if (span >= 360) return true;
            var end = start + span;
            // check both the raw angle and angle+360, since 0 and 360 are
            // the same physical direction - without this, a segment that
            // ends exactly at 360 (e.g. a "LF L" mount spanning 240-360)
            // would incorrectly reject a target at bearing 0 (dead ahead),
            // even though 0 is exactly the direction that segment reaches.
            if (angle >= start && angle <= end) return true;
            if ((angle + 360) >= start && (angle + 360) <= end) return true;
            return false;
        }

        // do two arcs (each given as world-frame start angle + span) share
        // any common direction? Used to decide whether two weapons on the
        // same ship would plausibly hit the same shield when firing at
        // range 0, where there's no bearing to derive this from otherwise.
        // Sampling every 10 degrees is enough given every arc in this game
        // is defined in multiples of 60.
        function arcsOverlap(startA, spanA, startB, spanB) {
            if (spanA >= 360 || spanB >= 360) return true;
            for (var deg = 0; deg < 360; deg += 10) {
                if (isAngleInSegment(deg, startA, spanA) && isAngleInSegment(deg, startB, spanB)) return true;
            }
            return false;
        }

        function weaponInArc(weapon, arc) {
            if (isAngleInSegment(arc, weapon.startP, weapon.arc)) return true;
            if (isAngleInSegment(arc, weapon.startP2, weapon.arc2)) return true;
            if (weapon.extraArcs) {
                for (var i = 0; i < weapon.extraArcs.length; i++) {
                    if (isAngleInSegment(arc, weapon.extraArcs[i].start, weapon.extraArcs[i].arc)) return true;
                }
            }
            return false;
        }

        // shows the damage chart a weapon will use against the currently
        // selected target - phasers show the full 1-6 damage-by-roll row,
        // disruptors/photons show hit chance + damage since they resolve
        // as a threshold roll rather than a direct roll->damage lookup
        function showWeaponDamageInfo(sId, wArrId) {
            var arrId = -1;
            for (var z = 0; z < shipList.length; z++) {
                if (shipList[z].userId == sId) { arrId = z; }
            }
            var weaponTypeId = shipList[arrId].shipWeapons[wArrId].weaponTypeId;
            var weapon = null;
            for (var y = 0; y < weaponList.length; y++) {
                if (weaponList[y].weaponTypeId == weaponTypeId) { weapon = weaponList[y]; }
            }
            if (!weapon) return;

            var str = '<div style="font-weight:bold;">' + weapon.weaponName + '</div>';

            if (weapon.weaponClassId == 4) {
                // drone rack: nothing here is target/range-dependent, so
                // this works whether or not a target is currently selected -
                // show the current loadout instead of a damage chart
                var rack = shipList[arrId].shipWeapons[wArrId];
                str += '<div>' + formatDroneLoadout(rack.droneLoadout, rack.droneRackSpaceCapacity) + '</div>';
                if (rack.bReloading) { str += '<div style="color:#069;padding-top:4px;">Reloading this turn</div>'; }
            } else {
                if (selTargetShipId == -1) return; // everything below needs a target
                var range = findDist(sId, selTargetShipId);

                // mirror the overload min-range bypass used to gate the fire
                // button itself, so this info popup doesn't contradict it
                var thisEntry = shipList[arrId].shipWeapons[wArrId];
                var isOverloadedDisruptorInfo = isDisruptorWeaponTypeId(weapon.weaponTypeId) && thisEntry.loadType == 'overload';
                var isOverloadedPhotonInfo = isPhotonWeaponTypeId(weapon.weaponTypeId) && thisEntry.loadType == 'overload';
                var infoEffMinRange = (isOverloadedDisruptorInfo || isOverloadedPhotonInfo) ? 0 : (weapon.minRange || 0);

                var minRangeNote = (weapon.minRange > 0) ? (', min ' + weapon.minRange + ((infoEffMinRange == 0) ? ' (waived - overloaded)' : '')) : '';
                str += '<div style="font-size:11px;color:#666;padding-bottom:6px;">Range to target: ' + range + ' (max ' + weapon.effRange + minRangeNote + ')</div>';

                if (!weapon.damageTable || weapon.damageTable.length == 0) {
                    str += '<div style="color:#666;">Damage chart for this weapon type is not yet implemented.</div>';
                } else if (range < infoEffMinRange) {
                    str += '<div style="color:#900;">Target is inside minimum range (' + weapon.minRange + ') - cannot fire.</div>';
                } else {
                    var hits = null;
                    try { hits = getDamage(weapon, range); } catch (e) { hits = null; }

                    if (!hits) {
                        str += '<div style="color:#900;">Target is out of effective range.</div>';
                    } else if (weapon.weaponClassId == 1) {
                        // phaser: direct roll(1-6) -> damage lookup
                        str += '<div style="font-weight:600;padding-bottom:2px;">Damage by 1d6 roll:</div>';
                        str += '<table class="weaponInfoTable"><tr>';
                        for (var r = 1; r <= 6; r++) str += '<th>' + r + '</th>';
                        str += '</tr><tr>';
                        for (var r = 1; r <= 6; r++) str += '<td>' + hits[r - 1] + '</td>';
                        str += '</tr></table>';
                    } else if (weapon.weaponClassId == 2) {
                        // disruptor/photon: threshold roll -> hit, then fixed damage
                        var threshold = hits[0];
                        var dmg = hits[1];
                        var pct = Math.round((threshold / 6) * 100);
                        str += '<div style="font-weight:600;">Hit chance:</div>';
                        str += '<div>Roll 1d6, hits on ' + threshold + ' or less (' + pct + '%)</div>';
                        str += '<div style="font-weight:600;padding-top:6px;">Damage if it hits:</div>';
                        str += '<div>' + dmg + ' points</div>';
                    } else {
                        str += '<div style="color:#666;">Damage chart for this weapon type is not yet implemented.</div>';
                    }
                }
            }

            $('#weaponInfoDiv').html(str);
            $('#weaponInfoPopUpDiv').css('display', 'block');
